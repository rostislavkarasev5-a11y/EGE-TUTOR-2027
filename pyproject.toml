[project]
name = "ege-tutor"
version = "0.7.0"
description = "EGE-TUTOR-2027: персональная система подготовки к ЕГЭ по профильной математике и информатике"
readme = "README.md"
requires-python = ">=3.13"
# Зависимости добавляются в той фазе, где они реально используются (ADR-0003):
# SQLAlchemy + Alembic — Phase 1, SymPy — Phase 2, сайт (FastAPI и др.) — Phase 12 сразу после
# Phase 2 (ADR-0013). ИИ (Phase 6) — Yandex AI Studio через urllib, без новой
# зависимости (ADR-0017).
dependencies = [
    "alembic>=1.20,<2",
    "argon2-cffi>=25.1,<26",
    "fastapi>=0.142,<1",
    "itsdangerous>=2.2,<3",
    "jinja2>=3.1.6,<4",
    "pydantic>=2.13,<3",
    "python-multipart>=0.0.32,<0.1",
    "pyyaml>=6.0.2,<7",
    "rich>=15,<16",
    "sqlalchemy>=2.1,<2.2",
    "sympy>=1.14,<2",
    "typer>=0.27,<0.28",
    "uvicorn>=0.54,<1",
]

[project.scripts]
ege = "ege_tutor.interfaces.cli.main:run"
ege-web = "ege_tutor.interfaces.web.cli:run"
ege-runner = "ege_tutor.sandbox.runner:run"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "hypothesis>=6.168",
    "pytest>=9.1",
    "ruff>=0.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ege_tutor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# RUF001-003: в проекте много русского текста, кириллица в строках и комментариях — норма.
ignore = ["RUF001", "RUF002", "RUF003"]
