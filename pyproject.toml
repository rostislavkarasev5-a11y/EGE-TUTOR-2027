[project]
name = "ege-tutor"
version = "0.1.0"
description = "EGE-TUTOR-2027: персональная система подготовки к ЕГЭ по профильной математике и информатике"
readme = "README.md"
requires-python = ">=3.13"
# Зависимости добавляются в той фазе, где они реально используются (ADR-0003):
# SQLAlchemy + Alembic — Phase 1, SymPy — Phase 2, anthropic — Phase 6, FastAPI — Phase 12.
dependencies = [
    "alembic>=1.20,<2",
    "pydantic>=2.13,<3",
    "pyyaml>=6.0.2,<7",
    "rich>=15,<16",
    "sqlalchemy>=2.1,<2.2",
    "typer>=0.27,<0.28",
]

[project.scripts]
ege = "ege_tutor.interfaces.cli.main:run"

[dependency-groups]
dev = [
    "hypothesis>=6.168",
    "pytest>=9.1",
    "ruff>=0.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ege_tutor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# RUF001-003: в проекте много русского текста, кириллица в строках и комментариях — норма.
ignore = ["RUF001", "RUF002", "RUF003"]
