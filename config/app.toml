# Основные настройки EGE-TUTOR-2027.
# Здесь только безопасные значения по умолчанию. Личные данные и ключи сюда не пишутся (ADR-0004).

[app]
name = "EGE-TUTOR-2027"
# Папка с локальными данными пользователя (база, бэкапы, личный контент). Закрыта .gitignore.
data_dir = "data"

# Даты экзаменов. Пока официального расписания нет, status = "TBD" и date не задаётся (ADR-0005).
# После публикации официального расписания:
#   status = "OFFICIAL"
#   date = 2027-06-XX
#   source = "ссылка на официальный документ"
[exams.MATH_PROFILE]
status = "TBD"

[exams.INFORMATICS]
status = "TBD"

[ai]
# ИИ-слой (Phase 6, ADR-0017): Yandex AI Studio. Без ИИ приложение работает полностью.
# Ключи сюда НЕ пишутся: только в переменные окружения на сервере
# (EGE_YANDEX_API_KEY, EGE_YANDEX_FOLDER_ID) — их записывает deploy/set-ai-key.sh.
# provider, model и monthly_budget_rub можно переопределить переменными
# EGE_AI_PROVIDER, EGE_AI_MODEL, EGE_AI_MONTHLY_BUDGET_RUB.
provider = "disabled"            # "disabled" или "yandex"
# Имя модели в каталоге (без gpt://каталог/). Другие варианты: "yandexgpt-lite/latest",
# "qwen3-235b-a22b-fp8/latest" — смотри список моделей в AI Studio.
model = "yandexgpt/latest"
base_url = "https://ai.api.cloud.yandex.net/v1"
# Лимит трат в месяц, рубли. Дошли до лимита — ИИ выключается до 1-го числа.
monthly_budget_rub = 300
# Цены за 1000 токенов, рубли с НДС. Перенеси с сайта Yandex Cloud (раздел «Тарифы AI Studio»).
# По умолчанию — с запасом выше реальных цен, чтобы расход не оказался больше лимита.
price_input_per_1000_rub = 1.2
price_output_per_1000_rub = 1.2
max_output_tokens = 1500
timeout_seconds = 60
temperature = 0.3

[speech]
# Голос репетитора (Phase 6.5, ADR-0018): озвучка ответов ИИ и распознавание вопросов голосом.
# Yandex SpeechKit, тот же ключ, что и у ИИ (нужны роли ai.speechkit-tts.user и
# ai.speechkit-stt.user). Работает, только когда ИИ включён; траты входят в тот же лимит.
enabled = true
# Голоса: marina, jane, omazh (женские), filipp, ermil, zahar (мужские) и другие — см. список
# голосов SpeechKit. role — характер голоса (у marina: neutral, friendly, whisper).
voice = "marina"
role = "friendly"
speed = 1.0
tts_url = "https://tts.api.cloud.yandex.net/tts/v3/utteranceSynthesis"
stt_url = "https://stt.api.cloud.yandex.net/speech/v1/stt:recognize"
# Цены с НДС по прайсу Yandex Cloud на 2026-10-08.
price_tts_per_request_rub = 0.1626
chars_per_request = 250
max_tts_chars = 3000
price_stt_per_15s_rub = 0.1626
max_recording_seconds = 30
timeout_seconds = 60

[sandbox]
# Python Sandbox появится в Phase 3 (ADR-0008).
# Основной вариант на Windows — Docker Desktop, запасной — WSL2.
backend = "docker"
fallback_backend = "wsl2"
time_limit_seconds = 10
memory_limit_mb = 256
network_enabled = false
