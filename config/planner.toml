# Расписание, план на день и дисциплина (Phase 7, ADR-0019).
# Все числа — стартовые предположения; после месяца использования их стоит пересмотреть.
# Личное расписание сюда НЕ пишется: оно хранится только в базе (ADR-0004).

[day]
# Часовой пояс ученика по умолчанию (часы от UTC). Меняется в профиле.
default_utc_offset_hours = 3
# Если окна для учёбы не заданы, на день планируется столько минут.
default_minutes = 60
# Меньше этого — плана нет: «сегодня выходной», дисциплина не страдает.
min_plan_minutes = 15
# Множитель времени по усталости из чек-ина: 1, 2, 3, 4, 5.
fatigue_factors = [1.0, 1.0, 0.9, 0.75, 0.5]

[plan]
# Доля бюджета под обязательные пункты; остальное — дополнительные.
mandatory_share = 0.8
# Сколько бюджета ученик может поменять сам (правило 80/20).
user_change_share = 0.2
# Время на задачу = норматив × time_factor (с разбором); без норматива — default_task_minutes.
time_factor = 1.3
default_task_minutes = 6
max_tasks_per_item = 4
review_tasks = 1
mistake_tasks = 2
diagnostic_minutes = 45
# Баланс предметов: доля времени не меньше этой, если по предмету есть задачи.
min_subject_share = 0.25
# Mastery номера, который ещё не изучали.
unstudied_mastery = 0.5
# Нижняя граница множителя разрыва предмета.
min_gap_factor = 0.2
# Обязательный пункт при переносе ищет ближайший день с окнами не дальше стольких дней.
carry_search_days = 14

[excuses]
# «Часто объективные причины»: больше warn_days дней с причинами за window_days дней.
warn_days = 4
window_days = 14

[control]
# Контрольная «я это знаю» по номеру ЕГЭ.
tasks = 6
min_tasks = 5
pass_share = 0.8
# Каждая задача не дольше норматива × slow_factor.
slow_factor = 1.5
# Задачи, решённые за последние fresh_days дней, в контрольную не берутся.
fresh_days = 14
# Сданный номер столько дней не попадает в тренировку (повторения остаются).
skip_days = 21

[discipline]
window_days = 7
green = 0.9
yellow = 0.75
orange = 0.5
# Красный и при стольких днях подряд без выполнения выполнимого плана.
red_streak_days = 3
