# Адаптивная диагностика (ADR-0016, Phase 5).
# Состав и количество задач определяет диагностический движок; здесь — бюджеты, пороги и модель.

[budget]
max_tasks_per_subject = 25
max_minutes_per_subject = 90

[stopping]
# Остановка, когда половина ширины диапазона прогноза ≤ этого числа ПЕРВИЧНЫХ баллов.
# Тестовые баллы появятся вместе с официальной таблицей перевода (Phase 9).
target_half_width_primary = 2.0
# Вероятность, которую покрывает диапазон прогноза.
forecast_interval = 0.8
# Остановка, когда лучшая задача уменьшает дисперсию прогноза меньше чем на это число.
min_information_gain = 0.01

[model]
# θ номера = g (общий уровень по предмету) + δ (отклонение номера).
model_version = "diag-v0"
ability_prior_sd = 1.5
item_offset_sd = 0.8
grid_step = 0.2
ability_grid_limit = 4.0
offset_grid_limit = 2.4
# P(верно | θ) = guess + (1 − guess) · σ(θ − (сложность − 3))
guess = 0.05
# Верно, но дольше 2× норматива: правдоподобие в этой степени (половинное свидетельство).
slow_evidence = 0.5
# Сложность первой задачи по номеру и сложность, для которой считается «P(решу номер)».
first_difficulty = 3
reference_difficulty = 3

[rules]
hints_allowed = false
ai_allowed = false
allowed_verification_statuses = ["REVIEWED"]
