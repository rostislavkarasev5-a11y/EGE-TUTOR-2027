{% extends "base.html" %}
{% from "macros.html" import csrf_field with context %}
{% block content %}
<h1>Профиль</h1>
<section class="card narrow">
  <form method="post" action="/profile">
    {{ csrf_field() }}
    <label>Как к тебе обращаться
      <input type="text" name="display_name" maxlength="100" value="{{ profile.display_name or '' }}">
    </label>
    <label>Цель по математике (0–100)
      <input type="number" name="target_math" min="0" max="100" value="{{ profile.targets[Subject.MATH_PROFILE] }}">
    </label>
    <label>Цель по информатике (0–100)
      <input type="number" name="target_informatics" min="0" max="100" value="{{ profile.targets[Subject.INFORMATICS] }}">
    </label>
    <button type="submit">Сохранить</button>
  </form>
</section>
{% endblock %}
