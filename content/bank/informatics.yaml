  # ── №10. Поиск слов в тексте (вместо документа — текстовый файл) ─────────
  - exam_item: 10
    source_ref: "EGE-TUTOR-2027, стартовый банк: информатика №10, задача 1"
    difficulty: 2
    time_norm_minutes: 4
    skills: [I10.text_search]
    assets: [informatics/files/i10_1.txt]
    statement: |-
      В файле i10_1.txt записан текст (на экзамене — документ текстового редактора; здесь —
      обычный текстовый файл в кодировке UTF-8; текст составлен случайно и смысла не имеет).
      Определите, сколько раз в тексте встречается слово «мост» в любом регистре (мост,
      Мост, МОСТ) как отдельное слово. Другие формы и слова, содержащие «мост» как часть
      («мосты», «мостик», «помост»), не учитываются. Знаки препинания рядом со словом
      допускаются.
    answer: 214
    solution: |-
