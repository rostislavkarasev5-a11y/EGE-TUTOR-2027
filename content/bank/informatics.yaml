  - exam_item: 18
    source_ref: "EGE-TUTOR-2027, стартовый банк: информатика №18, задача 2"
    difficulty: 3
    time_norm_minutes: 10
    skills: [I18.grid_dp]
    answer_type: SEQUENCE
    assets: [informatics/files/i18_2.csv]
    statement: |-
      Квадрат разлинован на N × N клеток. Значения клеток записаны в файле i18_2.csv: одна
      строка файла — одна строка квадрата, значения разделены знаком «;». В обычной клетке
      лежит монета достоинством от 1 до 99, а знак «#» обозначает стену: в эту клетку Робот
      заходить не может (на экзамене стены рисуют жирными линиями в электронной таблице).
      Робот стоит в левой верхней клетке, за один ход перемещается на одну клетку вправо
      или вниз и должен прийти в правую нижнюю клетку. Он собирает монеты во всех клетках
      маршрута, включая начальную и конечную.
      Определите максимальную и минимальную суммы, которые может собрать Робот. В ответе
      запишите через пробел сначала максимальную, затем минимальную сумму.
    answer: "2005 1322"
    solution: |-
      Та же динамика, что и без стен, но в клетку со стеной прийти нельзя, и из неё нельзя
      продолжить путь: для таких клеток значение «нет пути» (None), и при выборе лучшего
      предшественника они пропускаются.

      grid = [line.strip().split(";") for line in open("i18_2.csv", encoding="utf-8")]
      n = len(grid)
      hi = [[None] * n for _ in range(n)]
      lo = [[None] * n for _ in range(n)]
      for r in range(n):
          for c in range(n):
              if grid[r][c] == "#":
                  continue
              v = int(grid[r][c])
              if r == c == 0:
                  hi[r][c] = lo[r][c] = v
                  continue
              prev = [(pr, pc) for pr, pc in ((r - 1, c), (r, c - 1))
                      if pr >= 0 and pc >= 0 and hi[pr][pc] is not None]
              if prev:
                  hi[r][c] = v + max(hi[pr][pc] for pr, pc in prev)
                  lo[r][c] = v + min(lo[pr][pc] for pr, pc in prev)
      print(hi[-1][-1], lo[-1][-1])
    hints:
      - "Стена — это клетка, в которую нельзя прийти. Как отметить её в таблице лучших сумм?"
      - "Если обе соседние клетки (сверху и слева) недостижимы, текущая клетка тоже недостижима."
    tests:
      - files:
          i18_2.csv: |
            1;#;5
            2;9;#
            3;1;4
        output: "17 11"

