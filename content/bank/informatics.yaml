        output: "2 13"

  - exam_item: 26
    source_ref: "EGE-TUTOR-2027, стартовый банк: информатика №26, задача 3"
    difficulty: 4
    time_norm_minutes: 30
    skills: [I26.sorting_greedy, I00.lists]
    answer_type: SEQUENCE
    assets: [informatics/files/i26_3.txt]
    statement: |-
      Мастерская получила N заказов. Каждый заказ задан длительностью выполнения и сроком:
      заказ выполнен вовремя, если он завершён не позже своего срока. Мастер начинает работу
      в момент 0, выполняет заказы по одному без перерывов; часть заказов можно не выполнять.
      Мастер выбирает набор заказов, которые успеет выполнить вовремя, так, чтобы их было как
      можно больше; из всех таких наборов — тот, у которого суммарная длительность
      наименьшая.
      В первой строке файла i26_3.txt записано N, в каждой из следующих N строк — длительность
      и срок заказа через пробел (натуральные числа).
      В ответе запишите через пробел наибольшее количество заказов, выполненных вовремя, и
      суммарную длительность выбранного набора.
    answer: "3131 59977"
    solution: |-
      Алгоритм Мура — Ходжсона. Выбранные заказы выгодно выполнять в порядке сроков. Идём
      по заказам в порядке возрастания срока и добавляем каждый в набор; если текущее время
      превысило срок добавленного заказа, выкидываем из набора самый длинный заказ. Так
      набор всё время остаётся наибольшим по количеству и наименьшим по суммарной
      длительности.

      import heapq
      with open("i26_3.txt", encoding="utf-8") as f:
          n = int(f.readline())
          orders = [tuple(map(int, f.readline().split())) for _ in range(n)]
      taken, time = [], 0
      for duration, deadline in sorted(orders, key=lambda o: o[1]):
          heapq.heappush(taken, -duration)
          time += duration
          if time > deadline:
              time += heapq.heappop(taken)   # убираем самый длинный заказ
      print(len(taken), time)
    hints:
      - "Если набор заказов можно выполнить вовремя, то его можно выполнить в порядке возрастания сроков."
      - "Иди по заказам в порядке сроков. Что делать, если очередной заказ уже не успевает?"
      - "Выгоднее всего выбросить самый длинный из взятых заказов: для этого удобна куча (heapq)."
    tests:
      - files:
          i26_3.txt: |
            4
            3 3
            2 4
            4 5
            1 6
        output: "2 3"

