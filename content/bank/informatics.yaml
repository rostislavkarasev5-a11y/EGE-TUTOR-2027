  - exam_item: 9
    source_ref: "EGE-TUTOR-2027, стартовый банк: информатика №9, задача 3"
    difficulty: 4
    time_norm_minutes: 7
    skills: [I09.spreadsheet_rows]
    assets: [informatics/files/i09_3.csv]
    statement: |-
      В файле i09_3.csv в каждой строке записаны семь натуральных чисел, разделённых
      знаком «;» (вместо электронной таблицы — текстовый файл). Строки нумеруются с 1.
      Найдите номер последней строки, для которой одновременно выполнены условия:
      — разность между наибольшим и наименьшим числами строки меньше 30;
      — количество чисел строки, кратных 3, равно количеству чисел, кратных 5 (число,
        кратное 15, учитывается в обоих количествах).
    answer: 2299
    solution: |-
      Идём по строкам с номерами и запоминаем номер последней подходящей:

      answer = None
      for number, line in enumerate(open("i09_3.csv", encoding="utf-8"), start=1):
          row = list(map(int, line.split(";")))
          by3 = sum(1 for x in row if x % 3 == 0)
          by5 = sum(1 for x in row if x % 5 == 0)
          if max(row) - min(row) < 30 and by3 == by5:
              answer = number
      print(answer)

      Строки, где нет ни одного числа, кратного 3 или 5, тоже подходят (0 = 0).
    hints:
