      (с соблюдением условия Фано). Какое наименьшее количество двоичных знаков может
      занять закодированное слово КАРАКУРТ?
    answer: 18
    solution: |-
      Частоты букв в слове: К — 2, А — 2, Р — 2, У — 1, Т — 1. Свободные ветви дерева после
      01 и 110: 00, 10 и 111. Самые частые буквы К и А получают коды длины 2 (00 и 10),
      Т — 111. Длина: К 2·2 + А 2·2 + Р 2·2 + У 3 + Т 3 = 18.
    hints:
      - "Посчитай, сколько раз каждая буква встречается в слове."
      - "Найди свободные ветви двоичного дерева после кодов Р и У."
      - "Короткие коды выгоднее отдавать часто встречающимся буквам."

  - exam_item: 4
    source_ref: "EGE-TUTOR-2027, стартовый банк: информатика №4, задача 3"
    difficulty: 4
    time_norm_minutes: 3
    skills: [I04.prefix_codes]
    statement: |-
