      число по модулю не больше 10 000. Рассматриваются пары элементов, между которыми
      в последовательности стоят ровно два других элемента (то есть a[i] и a[i + 3]).
      Определите количество таких пар, в которых ровно один из двух элементов больше
      среднего арифметического всех элементов последовательности, а сумма элементов пары
      кратна 9. В ответе запишите через пробел количество найденных пар и наибольшую из
