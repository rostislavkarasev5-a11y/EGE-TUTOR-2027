  - exam_item: 12
    source_ref: "EGE-TUTOR-2027, стартовый банк: информатика №12, задача 3"
    difficulty: 4
    time_norm_minutes: 6
    skills: [I12.string_rewriting, I00.strings]
    statement: |-
      Исполнитель Редактор работает со строками цифр (команды заменить(v, w) и нашлось(v)).
      На вход программе подаётся строка из цифры 2, за которой идут n цифр 5 (n > 50).
      Найдите наименьшее n, при котором сумма цифр получившейся строки равна 19.

      ПОКА нашлось(25) ИЛИ нашлось(355) ИЛИ нашлось(555)
        ЕСЛИ нашлось(25)
          ТО заменить(25, 3)
          ИНАЧЕ ЕСЛИ нашлось(355)
            ТО заменить(355, 52)
            ИНАЧЕ заменить(555, 23)
          КОНЕЦ ЕСЛИ
        КОНЕЦ ЕСЛИ
      КОНЕЦ ПОКА
    answer: 55
    solution: |-
      Перебираем n начиная с 51 и моделируем программу:

      def run(s):
          while "25" in s or "355" in s or "555" in s:
              if "25" in s:
                  s = s.replace("25", "3", 1)
              elif "355" in s:
                  s = s.replace("355", "52", 1)
              else:
                  s = s.replace("555", "23", 1)
          return s

      n = 51
      while sum(map(int, run("2" + "5" * n))) != 19:
          n += 1
      print(n)
    hints:
      - "Напиши функцию, которая моделирует программу для любой строки."
      - "Перебирай n по возрастанию, начиная с 51, и считай сумму цифр результата."

