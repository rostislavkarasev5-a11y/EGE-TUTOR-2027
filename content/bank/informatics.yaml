  # ── №16. Рекурсивные функции ──────────────────────────────────────────────
  - exam_item: 16
    source_ref: "EGE-TUTOR-2027, стартовый банк: информатика №16, задача 1"
    difficulty: 2
    time_norm_minutes: 6
    skills: [I16.recursion, I00.functions_recursion]
    statement: |-
      Алгоритм вычисления значения функции F(n), где n — натуральное число, задан так:
      F(1) = 1;
      F(n) = F(n − 1) + 2·n, если n > 1 и n чётно;
      F(n) = F(n − 1) + n − 3, если n > 1 и n нечётно.
      Чему равно значение F(25)?
    answer: 445
    solution: |-
      def F(n):
          if n == 1:
              return 1
          if n % 2 == 0:
              return F(n - 1) + 2 * n
          return F(n - 1) + n - 3

      print(F(25))

      Без программы: F(25) = 1 + Σ(2n по чётным n от 2 до 24) + Σ(n − 3 по нечётным n от 3 до 25)
      = 1 + 312 + 132.
    hints:
      - "Функцию можно переписать на Python почти дословно."
      - "Можно и вручную: F(25) — это F(1) плюс сумма всех прибавок от n = 2 до n = 25."

  - exam_item: 16
    source_ref: "EGE-TUTOR-2027, стартовый банк: информатика №16, задача 2"
    difficulty: 3
    time_norm_minutes: 6
    skills: [I16.recursion, I00.functions_recursion]
    statement: |-
      Алгоритм вычисления значения функции F(n), где n — натуральное число, задан так:
      F(n) = n, если n ≥ 2026;
      F(n) = 2·n + F(n + 2), если n < 2026.
      Чему равно значение выражения F(1990) − F(1996)?
    answer: 11952
    solution: |-
      F(1990) = 2·1990 + F(1992) = 2·1990 + 2·1992 + F(1994) = 2·1990 + 2·1992 + 2·1994 + F(1996).
      Значит F(1990) − F(1996) = 2·(1990 + 1992 + 1994) = 2 · 5976 = 11952.
      Прямой рекурсивный вызов F(1990) не опасен (глубина около 20), но при меньших n
      понадобился бы sys.setrecursionlimit или вычисление в цикле.
    hints:
      - "Распиши F(1990) через F(1992), затем через F(1994) и так далее."
      - "Нужна только разность: длинный «хвост» рекурсии сократится."

  - exam_item: 16
    source_ref: "EGE-TUTOR-2027, стартовый банк: информатика №16, задача 3"
    difficulty: 4
    time_norm_minutes: 6
    skills: [I16.recursion, I00.functions_recursion]
    statement: |-
      Алгоритм вычисления значения функции F(n), где n — натуральное число, задан так:
      F(n) = n, если n ≤ 2;
      F(n) = F(n − 1) + F(n − 2), если n > 2 и n делится на 3;
      F(n) = F(n − 2) + n, если n > 2 и n не делится на 3.
      Для скольких натуральных n от 1 до 500 включительно значение F(n) делится на 9?
    answer: 53
    solution: |-
      Значения удобно считать в цикле по возрастанию n (рекурсия без запоминания была бы
      очень медленной):

      F = {}
      for n in range(1, 501):
          if n <= 2:
              F[n] = n
          elif n % 3 == 0:
              F[n] = F[n - 1] + F[n - 2]
          else:
              F[n] = F[n - 2] + n
      print(sum(1 for n in F if F[n] % 9 == 0))
    hints:
      - "Обычная рекурсия здесь вызывает одни и те же значения много раз. Как этого избежать?"
      - "Храни уже вычисленные значения в словаре или используй functools.cache."
      - "Считай значения по возрастанию n, тогда F(n − 1) и F(n − 2) уже известны."

