  - exam_item: 25
    source_ref: "EGE-TUTOR-2027, стартовый банк: информатика №25, задача 2"
    difficulty: 3
    time_norm_minutes: 10
    skills: [I25.divisors_masks, I00.loops_conditions]
    answer_type: SEQUENCE
    assets: [informatics/files/i25_2.txt]
    statement: |-
      В файле i25_2.txt записаны два натуральных числа A и B (A < B) через пробел — границы
      отрезка (они вынесены в файл, чтобы программу можно было проверить на маленьких
      примерах).
      Найдите все натуральные числа на отрезке [A; B], у которых ровно 6 различных нечётных
      натуральных делителей. В ответе запишите через пробел количество таких чисел
      и наибольшее из них.
    answer: "973 269975"
    solution: |-
      Нечётные делители числа n — это все делители его нечётной части (n, делённого на 2,
      пока делится). Делители считаем парами d и m / d до корня:

      def odd_divisors(n):
          while n % 2 == 0:
              n //= 2
          count, d = 0, 1
          while d * d <= n:
              if n % d == 0:
                  count += 1 if d * d == n else 2
              d += 2
          return count

      a, b = map(int, open("i25_2.txt", encoding="utf-8").read().split())
      found = [n for n in range(a, b + 1) if odd_divisors(n) == 6]
      print(len(found), max(found))
    hints:
      - "Чтобы найти делители быстро, перебирай d только до корня из n и учитывай пару d и n // d."
      - "Как связаны нечётные делители числа и его нечётная часть (n без множителей 2)?"
      - "Не забудь, что при d · d = n делитель d нужно посчитать один раз."
    tests:
      - files:
          i25_2.txt: "1 100\n"
        output: "5 99"

  - exam_item: 25
    source_ref: "EGE-TUTOR-2027, стартовый банк: информатика №25, задача 3"
    difficulty: 4
    time_norm_minutes: 10
    skills: [I25.divisors_masks, I00.loops_conditions]
    answer_type: SEQUENCE
    assets: [informatics/files/i25_3.txt]
    statement: |-
      В файле i25_3.txt через пробел записаны маска, делитель D и граница L (маска и числа
      вынесены в файл, чтобы программу можно было проверить на маленьких примерах).
      Маска состоит из цифр и символов «?» и «*»: «?» обозначает ровно одну любую цифру,
      «*» — любую последовательность цифр, в том числе пустую. Например, маске 12*4
      соответствуют числа 124, 1204, 1235674.
      Найдите все натуральные числа, не превышающие L, которые соответствуют маске и делятся
      на D (запись числа не начинается с нуля). В ответе запишите через пробел количество
      таких чисел и частное от деления наибольшего из них на D.
    answer: "8 38103"
    solution: |-
      Перебираем длину последовательности на месте «*» (от 0 до такой, чтобы число не стало
      длиннее L) и все цифры для «?» и «*», собираем числа и проверяем условия:

      from itertools import product
      mask, d, limit = open("i25_3.txt", encoding="utf-8").read().split()
      d, limit = int(d), int(limit)
      fixed = len(mask) - mask.count("*")
      found = set()
      for k in range(len(str(limit)) - fixed + 1):
          slots = mask.count("?") + mask.count("*") * k
          for digits in product("0123456789", repeat=slots):
              it = iter(digits)
              text = "".join(next(it) if ch == "?"
                             else "".join(next(it) for _ in range(k)) if ch == "*"
                             else ch for ch in mask)
              if text[0] != "0" and int(text) <= limit and int(text) % d == 0:
                  found.add(int(text))
      print(len(found), max(found) // d)

      Другой способ — перебирать числа, кратные D, и сравнивать их с маской через
      fnmatch.fnmatch(str(n), mask) (в fnmatch «?» и «*» означают то же самое), но при большом L
      это медленнее.
    hints:
      - "Сколько цифр может стоять на месте «*», чтобы число не превысило L?"
      - "Перебери все варианты цифр для «?» и «*» через itertools.product."
      - "Для проверки на маленьких примерах подойдёт и fnmatch.fnmatch(str(n), маска)."
    tests:
      - files:
          i25_3.txt: "1?2*3 7 100000\n"
        output: "15 2749"

  # ── №26. Обработка данных и сортировка ────────────────────────────────────
  - exam_item: 26
    source_ref: "EGE-TUTOR-2027, стартовый банк: информатика №26, задача 1"
    difficulty: 2
    time_norm_minutes: 30
    skills: [I26.sorting_greedy, I00.lists]
    answer_type: SEQUENCE
    assets: [informatics/files/i26_1.txt]
    statement: |-
      Грузовик может увезти не больше M килограммов груза. На складе N коробок, масса каждой
      известна. Коробки грузят по одной, начиная с самой лёгкой и далее по возрастанию массы;
      как только очередная коробка не помещается (суммарная масса превысила бы M), погрузка
      прекращается.
      В первой строке файла i26_1.txt записаны числа M и N, в каждой из следующих N строк —
      масса одной коробки (натуральное число).
      В ответе запишите через пробел количество погруженных коробок и сколько килограммов
      осталось свободными (M минус суммарная масса погруженных коробок).
    answer: "206 38"
    solution: |-
      Сортируем массы по возрастанию и добавляем, пока помещается:

      with open("i26_1.txt", encoding="utf-8") as f:
          m, n = map(int, f.readline().split())
          masses = sorted(int(f.readline()) for _ in range(n))
      count = total = 0
      for x in masses:
          if total + x > m:
              break
          total += x
          count += 1
      print(count, m - total)
    hints:
      - "Первая строка файла отличается от остальных: прочитай её отдельно."
      - "Отсортируй массы и складывай их по порядку, пока сумма не превысит M."
    tests:
      - files:
          i26_1.txt: |
            10 5
            4
            1
            3
            6
            2
        output: "4 0"
      - files:
          i26_1.txt: |
            7 3
            5
            5
            5
        output: "1 2"

  - exam_item: 26
    source_ref: "EGE-TUTOR-2027, стартовый банк: информатика №26, задача 2"
    difficulty: 3
    time_norm_minutes: 30
    skills: [I26.sorting_greedy, I00.lists]
    answer_type: SEQUENCE
    assets: [informatics/files/i26_2.txt]
    statement: |-
      В конференц-зал поступили N заявок на проведение мероприятий. Каждая заявка задана
      временем начала и временем окончания в минутах от открытия зала; мероприятие занимает
      зал в промежутке [начало; окончание). Мероприятия в зале не могут пересекаться, но
      одно может начаться ровно в момент окончания другого.
      Администратор выбирает наибольшее возможное количество заявок. Если таких наборов
      несколько, он выбирает тот, в котором последнее мероприятие заканчивается как можно
      раньше.
      В первой строке файла i26_2.txt записано N, в каждой из следующих N строк — время
      начала и время окончания заявки через пробел.
      В ответе запишите через пробел наибольшее количество заявок и время окончания
      последнего мероприятия в выбранном наборе.
    answer: "37 842"
    solution: |-
      Жадный алгоритм: сортируем заявки по времени окончания и берём очередную, если она
      начинается не раньше окончания последней выбранной. Такой выбор даёт наибольшее
      количество заявок, а последнее мероприятие в нём заканчивается раньше, чем в любом
      другом наборе из того же количества заявок.

      with open("i26_2.txt", encoding="utf-8") as f:
          n = int(f.readline())
          req = [tuple(map(int, f.readline().split())) for _ in range(n)]
      count, last = 0, -1
      for start, end in sorted(req, key=lambda r: r[1]):
          if start >= last:
              count += 1
              last = end
      print(count, last)
    hints:
      - "Какую заявку выгоднее всего взять первой, чтобы оставить больше времени остальным?"
      - "Отсортируй заявки по времени окончания."
      - "Заявка подходит, если её начало не раньше окончания последней выбранной."
    tests:
      - files:
          i26_2.txt: |
            4
            0 10
