    statement: |-
      Два игрока, Петя и Ваня, играют в игру. Перед ними лежит куча камней. Игроки ходят по
      очереди, первый ход делает Петя. За один ход игрок может добавить в кучу один камень
      или увеличить количество камней в куче в два раза. Игра завершается, когда количество
      камней в куче становится не менее 35. Победителем считается игрок, сделавший последний
      ход. В начальный момент в куче S камней, 1 ≤ S ≤ 34.
      Известно, что Ваня выиграл своим первым ходом после неудачного первого хода Пети.
      Укажите минимальное значение S, при котором это возможно.
    answer: 9
    solution: |-
      Ваня выигрывает первым ходом, если после хода Пети в куче не меньше 18 камней (тогда
      удвоение даёт 36 ≥ 35), но меньше 35. Петя может получить 18 из S = 9 удвоением
      (9 · 2 = 18). При S < 9 после любого хода Пети в куче меньше 18 камней:
      наибольшее — 8 · 2 = 16, и Ваня выиграть первым ходом не может.
    hints:
      - "С какого количества камней игрок может закончить игру одним ходом?"
      - "Петя ошибается, если после его хода в куче оказывается именно такое количество камней."

