      Коды двух букв известны: А — 1, Б — 011. Сколько существует способов выбрать коды для
      букв В и Г так, чтобы длина каждого из них была не больше 4 и весь код удовлетворял
      условию Фано? Способы, в которых коды В и Г меняются местами, считаются разными.
    answer: 66
    solution: |-
      Свободные части дерева: поддерево 00 и поддерево 010. В поддереве 00 кодов длины
      не больше 4 семь (00, 000, 001, 0000, 0001, 0010, 0011), в поддереве 010 — три (010,
      0100, 0101). Коды В и Г должны быть разными и не быть началом друг друга.
      Пары внутри поддерева 00: всего C(7, 2) = 21, из них 10 пар «начало — продолжение»,
      остаётся 11. Внутри 010: 3 − 2 = 1. Пары из разных поддеревьев: 7 · 3 = 21.
      Итого неупорядоченных пар 33, упорядоченных — 66.
      Проверка программой: перебрать все слова длины 1–4 для В и Г и проверить условие Фано.
