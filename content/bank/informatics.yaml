      import re
      words = re.findall(r"[а-яё]+", open("i10_1.txt", encoding="utf-8").read().lower())
      print(words.count("мост"))

      В текстовом редакторе: поиск с параметрами «только слово целиком», без учёта регистра.
    hints:
      - "Простой поиск подстроки «мост» найдёт и «мостик», и «помост» — так считать нельзя."
      - "Выдели из текста слова (например, регулярным выражением) и сравнивай слово целиком."
    tests:
      - files:
          i10_1.txt: |
            Мост и мосты. Старый мост, новый мостик! МОСТ? помост мостом
        output: 3

