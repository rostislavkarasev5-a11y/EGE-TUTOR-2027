    assets: [informatics/files/i27_1.txt]
    statement: |-
      В файле i27_1.txt записаны координаты точек на плоскости: в каждой строке два целых
      числа x и y через пробел. Точки образуют два кластера. Две точки относятся к одному
      кластеру, если их можно соединить цепочкой точек, в которой расстояние между
      соседними точками цепочки не больше 6.
      Центр кластера — это точка кластера, у которой сумма расстояний до всех остальных
      точек этого кластера наименьшая (для данных из файла она единственная).
      В ответе запишите через пробел сумму абсцисс центров кластеров и сумму их ординат.
    answer: "730 437"
    solution: |-
      1) Разбиваем точки на кластеры: обход в ширину, соседи — точки на расстоянии не больше 6.
         Чтобы не сравнивать все пары, точки раскладывают по квадратам 6 × 6: соседи точки
         лежат в её квадрате и в восьми соседних.
      2) В каждом кластере для каждой точки считаем сумму расстояний (math.dist) до остальных
         и берём точку с наименьшей суммой.
      3) Складываем координаты центров.
      Полный текст программы — в эталонном решении (content/bank/informatics/solutions/i27_1.py).
