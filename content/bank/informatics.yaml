      Решаем программой с теми же функциями, что и в задачах №19–20:

      from functools import cache

      def moves(p):
          a, b = p
          return [(a + 2, b), (a, b + 2), (a * 2, b), (a, b * 2)]

      @cache
      def win1(p):
          return any(sum(q) >= 64 for q in moves(p))

      @cache
      def lose1(p):
          return not win1(p) and all(win1(q) for q in moves(p))

      @cache
      def win2(p):
          return not win1(p) and any(lose1(q) for q in moves(p))

      def lose2(p):
