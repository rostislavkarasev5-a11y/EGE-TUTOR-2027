  - exam_item: 19
    source_ref: "EGE-TUTOR-2027, стартовый банк: информатика №19, задача 3"
    difficulty: 4
    time_norm_minutes: 4
    skills: [I19.winning_strategy, I19.game_analysis_code]
    statement: |-
      Два игрока, Петя и Ваня, играют в игру с двумя кучами камней. Игроки ходят по очереди,
      первый ход делает Петя. За один ход игрок может добавить один камень в одну из куч или
      увеличить количество камней в одной из куч в два раза. Игра завершается, когда суммарное
      количество камней в двух кучах становится не менее 77. Победителем считается игрок,
      сделавший последний ход. В начальный момент в первой куче 6 камней, во второй — S
      камней, 1 ≤ S ≤ 70.
      Известно, что Ваня выиграл своим первым ходом после неудачного первого хода Пети.
      Укажите минимальное значение S, при котором это возможно.
    answer: 18
    solution: |-
      Из позиции (a, b) можно выиграть одним ходом, если a + b + max(a, b) ≥ 77: удвоение
      большей кучи — самый сильный ход. Петя должен перейти в такую позицию (с суммой меньше
      77). При S = 18 Петя удваивает вторую кучу: (6, 36), и Ваня удваивает её: 6 + 72 = 78.
      При S ≤ 17 любой ход Пети даёт вторую кучу не больше 34 (или первую не больше 12), и
      удвоение не доводит сумму до 77.
      Проверка программой — перебор позиций с функцией «выигрыш первым ходом»:

      def moves(a, b):
          return [(a + 1, b), (a, b + 1), (a * 2, b), (a, b * 2)]

      def win1(a, b):
          return any(x + y >= 77 for x, y in moves(a, b))

      print(min(s for s in range(1, 71)
                if any(x + y < 77 and win1(x, y) for x, y in moves(6, s))))
