      Какое наибольшее количество цветов может быть в палитре изображения?
    answer: 256
    solution: |-
      За 3 минуты передаётся 256 000 · 180 = 46 080 000 бит, на одно изображение — не больше
      1 843 200 бит. После сжатия остаётся 75 % объёма: 640 · 480 · i · 0,75 ≤ 1 843 200,
      то есть 230 400 · i ≤ 1 843 200, i ≤ 8 бит на пиксель. Наибольшее число цветов 2⁸ = 256.
    hints:
