    answer: 12
    solution: |-
      Занятые ветви двоичного дерева: 00, 011, 10. Свободными остаются ветви 010 и 11.
      Для Г и Д возьмём 11 (длина 2) и 010 (длина 3). Короче нельзя: кодов длины 1 нет
      (0 и 1 — начала уже занятых слов), а свободный код длины 2 только один — 11.
      Сумма: 2 + 3 + 2 + 2 + 3 = 12.
    hints:
