    source_ref: "EGE-TUTOR-2027, стартовый банк: информатика №17, задача 2"
    difficulty: 3
    time_norm_minutes: 12
    skills: [I17.sequences, I00.files]
    answer_type: SEQUENCE
    assets: [informatics/files/i17_2.txt]
    statement: |-
      В файле i17_2.txt записана последовательность целых чисел, по одному в строке; каждое
      число по модулю не больше 10 000. Тройкой называются три идущих подряд элемента
      последовательности. Пусть M — наибольший из двузначных элементов последовательности,
      десятичная запись которых оканчивается цифрой 7 (двузначным считается число, модуль
      которого от 10 до 99).
      Определите количество троек, в которых ровно два элемента двузначные, а сумма
      элементов тройки положительна и кратна M. В ответе запишите через пробел количество
      найденных троек и наибольшую из сумм элементов таких троек.
    answer: "21 9603"
    solution: |-
      a = [int(line) for line in open("i17_2.txt", encoding="utf-8")]

      def two_digit(x):
          return 10 <= abs(x) <= 99

      m = max(x for x in a if two_digit(x) and abs(x) % 10 == 7)
      count, best = 0, None
      for i in range(len(a) - 2):
          t = a[i:i + 3]
          if sum(map(two_digit, t)) == 2 and sum(t) > 0 and sum(t) % m == 0:
              count += 1
              best = sum(t) if best is None else max(best, sum(t))
      print(count, best)

      Последнюю цифру отрицательного числа берём от модуля: abs(x) % 10.
    hints:
      - "Сначала одним проходом найди M, потом вторым проходом перебирай тройки."
      - "Для отрицательных чисел последняя цифра — это abs(x) % 10, а не x % 10."
      - "«Ровно два двузначных» — посчитай, сколько элементов тройки двузначные."
    tests:
