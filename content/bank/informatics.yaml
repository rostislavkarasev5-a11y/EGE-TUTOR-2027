      - "Посчитай пары, в которых одно слово не является началом другого, и учти порядок букв."

  # ── №5. Анализ и построение алгоритмов ────────────────────────────────────
  - exam_item: 5
    source_ref: "EGE-TUTOR-2027, стартовый банк: информатика №5, задача 1"
    difficulty: 2
    time_norm_minutes: 5
    skills: [I05.number_algorithms, I00.basics]
    statement: |-
      На вход алгоритма подаётся натуральное число N. Алгоритм строит по нему число R так:
      1) строится двоичная запись числа N;
      2) если количество единиц в этой записи чётное, к ней справа дописывается 0,
         иначе справа дописываются две единицы 11;
      3) полученная запись — двоичная запись числа R.
      Укажите минимальное число R, большее 100, которое может получиться в результате работы
      алгоритма. Ответ запишите в десятичной системе.
    answer: 102
    solution: |-
      Любое R оканчивается либо на 0 (тогда в остальной части чётное число единиц), либо на 11
      (тогда в остальной части — без двух последних единиц — нечётное число единиц).
      101 = 1100101₂ оканчивается на 01 — не подходит. 102 = 1100110₂: оканчивается на 0,
      в записи 110011 четыре единицы — чётное число, подходит (N = 51).
      Программа: перебрать N от 1 до 1000, вычислить R и взять минимальное R > 100.
    hints:
      - "Каким может быть конец двоичной записи R?"
      - "Проверяй числа больше 100 по очереди: подходит ли их двоичная запись под одно из двух правил?"

  - exam_item: 5
    source_ref: "EGE-TUTOR-2027, стартовый банк: информатика №5, задача 2"
    difficulty: 3
    time_norm_minutes: 5
    skills: [I05.number_algorithms, I00.loops_conditions]
    statement: |-
      На вход алгоритма подаётся натуральное число N. Алгоритм строит по нему число R так:
      1) строится троичная запись числа N;
      2) если N делится на 3, к этой записи справа дописываются две её последние цифры;
         иначе справа дописывается остаток от деления суммы цифр троичной записи на 3;
      3) полученная запись — троичная запись числа R.
      Например, N = 5 = 12₃: 5 не делится на 3, сумма цифр 3, остаток 0, R = 120₃ = 15.
      Укажите минимальное N, при котором получается R, большее 300.
    answer: 33
    solution: |-
      Программа перебирает N = 1, 2, 3, … и останавливается на первом N, для которого R > 300:

      def ternary(n):
          s = ""
          while n > 0:
              s = str(n % 3) + s
              n //= 3
          return s

      n = 1
      while True:
          s = ternary(n)
          s += s[-2:] if n % 3 == 0 else str(sum(map(int, s)) % 3)
          if int(s, 3) > 300:
              break
          n += 1
      print(n)

      Проверка: 33 = 1020₃, делится на 3, R = 102020₃ = 303 > 300; для меньших N R ≤ 300.
    hints:
      - "Напиши функцию перевода числа в троичную запись и проверь её на примере из условия."
      - "Для чисел, кратных 3, запись удлиняется на две цифры, для остальных — на одну."
      - "Перебирай N по возрастанию и останавливайся на первом подходящем."

  - exam_item: 5
    source_ref: "EGE-TUTOR-2027, стартовый банк: информатика №5, задача 3"
    difficulty: 4
    time_norm_minutes: 5
    skills: [I05.number_algorithms, I00.strings]
    statement: |-
      На вход алгоритма подаётся натуральное число N. Алгоритм строит по нему число R так:
      1) вычисляются сумма чётных цифр числа N и сумма нечётных цифр числа N (цифра 0
         считается чётной);
      2) R — число, записанное этими двумя суммами подряд: сначала бо́льшая сумма, затем
         меньшая (если суммы равны — одна за другой).
      Например, N = 2741: сумма чётных 2 + 4 = 6, нечётных 7 + 1 = 8, R = 86.
      Сколько существует четырёхзначных чисел N, для которых R = 1610?
    answer: 78
    solution: |-
      Запись 1610 можно разрезать на «1 и 610», «16 и 10», «161 и 0». Суммы цифр
      четырёхзначного числа не больше 36, поэтому подходит только «16 и 10»: одна сумма
      равна 16, другая 10. Перебор всех N от 1000 до 9999 программой:

      count = 0
      for n in range(1000, 10000):
          d = list(map(int, str(n)))
          e = sum(x for x in d if x % 2 == 0)
          o = sum(x for x in d if x % 2 == 1)
          if int(f"{max(e, o)}{min(e, o)}") == 1610:
              count += 1
      print(count)
    hints:
      - "На какие две суммы можно разбить запись 1610 с учётом того, что сначала идёт бо́льшая сумма?"
      - "Четырёхзначных чисел всего 9000 — их удобно перебрать программой."
      - "Аккуратно отдели чётные цифры от нечётных: x % 2 == 0."

