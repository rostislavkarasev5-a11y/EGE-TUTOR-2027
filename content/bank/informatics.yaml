    skills: [I19.winning_strategy, I19.game_analysis_code]
    answer_type: SEQUENCE
    statement: |-
      Два игрока, Петя и Ваня, играют в игру с двумя кучами камней. Игроки ходят по очереди,
      первый ход делает Петя. За один ход игрок может добавить один камень в одну из куч или
      увеличить количество камней в одной из куч в три раза. Игра завершается, когда суммарное
      количество камней в двух кучах становится не менее 84. Победителем считается игрок,
      сделавший последний ход. В начальный момент в первой куче 7 камней, во второй — S
      камней, 1 ≤ S ≤ 76.
      Найдите два таких значения S, при которых у Пети есть выигрышная стратегия, причём
      одновременно: Петя не может выиграть за один ход, но может выиграть своим вторым
      ходом независимо от того, как будет ходить Ваня. Запишите найденные значения
      в порядке возрастания через пробел.
    answer: "20 25"
    solution: |-
      Удобно решить программой, которая для каждой позиции определяет, выигрывает ли
      ходящий первым ходом (win1), проигрывает ли он после любого своего хода (lose1) и
      выигрывает ли он вторым ходом (win2):

      from functools import cache

      def moves(p):
          a, b = p
          return [(a + 1, b), (a, b + 1), (a * 3, b), (a, b * 3)]

      @cache
      def win1(p):
          return any(sum(q) >= 84 for q in moves(p))

      @cache
      def lose1(p):
          return not win1(p) and all(win1(q) for q in moves(p))

      @cache
      def win2(p):
          return not win1(p) and any(lose1(q) for q in moves(p))

      print(*[s for s in range(1, 77) if win2((7, s))])

      Например, при S = 25 Петя добавляет камень в первую кучу: (8, 25). Любой ход Вани
      оставляет сумму меньше 84 (самый сильный — (8, 75), сумма 83), а после любого его хода
      Петя заканчивает игру: утраивает вторую кучу или добавляет один камень.
    hints:
      - "Сначала найди условие выигрыша одним ходом: какой ход самый сильный?"
      - "Позиция проигрышна для ходящего, если все его ходы ведут в позиции выигрыша первым ходом."
      - "Перебор позиций удобно сделать программой с функциями win1, lose1, win2."

