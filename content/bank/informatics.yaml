  # ── №23. Количество программ ──────────────────────────────────────────────
  - exam_item: 23
    source_ref: "EGE-TUTOR-2027, стартовый банк: информатика №23, задача 1"
    difficulty: 2
    time_norm_minutes: 8
    skills: [I23.program_count, I00.functions_recursion]
    statement: |-
      Исполнитель преобразует число на экране. У исполнителя есть три команды:
      1. Прибавить 1;
      2. Прибавить 3;
      3. Умножить на 2.
      Программа — это последовательность команд. Сколько существует программ, для которых
      при исходном числе 2 результатом является число 21?
    answer: 2033
    solution: |-
      Обозначим K(n) — количество программ, получающих 21 из n. K(21) = 1, K(n) = 0 при n > 21,
      иначе K(n) = K(n + 1) + K(n + 3) + K(2n).

      def count(a, b):
          if a == b:
              return 1
          if a > b:
              return 0
          return count(a + 1, b) + count(a + 3, b) + count(a * 2, b)

      print(count(2, 21))

      Можно и таблицей: заполнять количество программ от 21 вниз до 2.
    hints:
      - "Сколько программ ведёт в 21 из числа, которое больше 21? А из самого 21?"
      - "Количество программ из n — сумма количеств программ из чисел, в которые n переходит одной командой."

  - exam_item: 23
    source_ref: "EGE-TUTOR-2027, стартовый банк: информатика №23, задача 2"
    difficulty: 3
    time_norm_minutes: 8
    skills: [I23.program_count, I00.functions_recursion]
    statement: |-
      Исполнитель преобразует число на экране. У исполнителя есть три команды:
      1. Прибавить 1;
      2. Прибавить 2;
      3. Умножить на 3.
      Программа — это последовательность команд. Траектория программы — последовательность
      чисел, которые получаются на экране после выполнения команд.
      Сколько существует программ, для которых при исходном числе 3 результатом является
      число 40, при этом траектория содержит число 12 и не содержит число 30?
    answer: 8385434
    solution: |-
      Путь распадается на две независимые части: из 3 в 12 и из 12 в 40, не проходя через 30.
      Ответ — произведение количеств программ для частей:

      def count(a, b):
          if a == 30 or a > b:
              return 0
          if a == b:
              return 1
          return count(a + 1, b) + count(a + 2, b) + count(a * 3, b)

      print(count(3, 12) * count(12, 40))
    hints:
      - "Обязательная точка 12 делит путь на два участка. Как связаны количества программ на них с общим количеством?"
      - "Запрет числа 30: при попадании в 30 функция должна возвращать 0."
      - "Для большого b рекурсия без запоминания может работать долго — пригодится functools.cache."

  - exam_item: 23
    source_ref: "EGE-TUTOR-2027, стартовый банк: информатика №23, задача 3"
    difficulty: 4
    time_norm_minutes: 8
    skills: [I23.program_count, I00.functions_recursion]
    statement: |-
      Исполнитель преобразует число на экране. У исполнителя есть три команды:
      1. Прибавить 1;
      2. Умножить на 2;
      3. Умножить на 3.
      Траектория программы — последовательность чисел, которые получаются на экране после
      выполнения команд. Сколько существует программ, для которых при исходном числе 2
      результатом является число 60, при этом траектория содержит хотя бы одно из чисел
      10 и 15 и не содержит числа 30?
    answer: 735
    solution: |-
      Обозначим K(a, b) — количество программ из a в b, не проходящих через 30.
      По формуле включений-исключений: (через 10) + (через 15) − (через 10 и 15)
      = K(2, 10)·K(10, 60) + K(2, 15)·K(15, 60) − K(2, 10)·K(10, 15)·K(15, 60).
      Можно и одной рекурсией с флагом «уже были в 10 или 15»:

      def count(a, b, visited=False):
          if a == 30 or a > b:
              return 0
          visited = visited or a in (10, 15)
          if a == b:
              return 1 if visited else 0
          return (count(a + 1, b, visited) + count(a * 2, b, visited)
                  + count(a * 3, b, visited))

      print(count(2, 60))
    hints:
      - "«Хотя бы одно из чисел» — подумай о формуле включений-исключений."
      - "Или передавай в рекурсию признак того, что 10 или 15 уже встречались."
      - "Не забудь, что запрет на 30 действует на всём пути."

  # ── №24. Обработка символьных строк ───────────────────────────────────────
  - exam_item: 24
    source_ref: "EGE-TUTOR-2027, стартовый банк: информатика №24, задача 1"
    difficulty: 2
    time_norm_minutes: 16
    skills: [I24.strings_file, I00.files]
    assets: [informatics/files/i24_1.txt]
    statement: |-
      Текстовый файл i24_1.txt состоит из одной строки, в которой записаны заглавные
      латинские буквы X, Y, Z и W.
      Определите максимальное количество идущих подряд символов, среди которых нет букв,
      отличных от X и Y (то есть максимальную длину подстроки, состоящей только из букв
      X и Y).
    answer: 45
    solution: |-
      Идём по строке и считаем длину текущего участка из X и Y; при другой букве счётчик
      обнуляется.

      s = open("i24_1.txt", encoding="utf-8").read().strip()
      best = cur = 0
      for ch in s:
          cur = cur + 1 if ch in "XY" else 0
          best = max(best, cur)
      print(best)
    hints:
      - "Храни длину текущего подходящего участка и обнуляй её на «чужой» букве."
      - "После каждого символа сравнивай текущую длину с лучшей."
    tests:
      - files:
          i24_1.txt: "XYYXZXXW\n"
        output: 4
      - files:
          i24_1.txt: "ZWZ\n"
        output: 0

  - exam_item: 24
    source_ref: "EGE-TUTOR-2027, стартовый банк: информатика №24, задача 2"
    difficulty: 3
    time_norm_minutes: 16
    skills: [I24.strings_file, I00.files]
    assets: [informatics/files/i24_2.txt]
    statement: |-
      Текстовый файл i24_2.txt состоит из одной строки, в которой записаны заглавные
      латинские буквы Q, R, S, T и Z.
      Определите максимальную длину подстроки (последовательности идущих подряд символов),
      в которой буква Z встречается не более трёх раз.
    answer: 169
    solution: |-
      Метод двух указателей («скользящее окно»): правую границу двигаем по строке, а левую
      сдвигаем вперёд, пока в окне больше трёх букв Z.

      s = open("i24_2.txt", encoding="utf-8").read().strip()
      best = left = z = 0
      for right, ch in enumerate(s):
          z += ch == "Z"
          while z > 3:
              z -= s[left] == "Z"
              left += 1
          best = max(best, right - left + 1)
      print(best)

      Другой способ: запомнить позиции всех Z; лучшая подстрока лежит между Z с номером i
      и Z с номером i + 4 (не включая их).
    hints:
      - "Перебор всех подстрок слишком медленный для длинной строки. Подумай о «скользящем окне»."
      - "Можно выписать позиции всех букв Z и смотреть на промежутки между ними."
      - "Не забудь участки в начале и в конце строки."
    tests:
      - files:
          i24_2.txt: "ZQZRZSZT\n"
        output: 7

  - exam_item: 24
    source_ref: "EGE-TUTOR-2027, стартовый банк: информатика №24, задача 3"
    difficulty: 4
    time_norm_minutes: 16
    skills: [I24.strings_file, I00.files]
    assets: [informatics/files/i24_3.txt]
    statement: |-
      Текстовый файл i24_3.txt состоит из одной строки, в которой записаны заглавные
      латинские буквы A, B и C.
      Определите максимальную длину подстроки (последовательности идущих подряд символов),
      в которой количество букв A равно количеству букв B. Подстрока может состоять и только
      из букв C (тогда букв A и B в ней поровну — по нулю).
    answer: 455
    solution: |-
      Пусть balance — разность «число A минус число B» в начале строки длины i. Подстрока
      с i-го по j-й символ содержит поровну A и B, когда баланс в позициях i и j одинаков.
      Для каждого значения баланса запоминаем первую позицию, где он встретился:

      s = open("i24_3.txt", encoding="utf-8").read().strip()
      first = {0: 0}
      balance = best = 0
      for i, ch in enumerate(s, start=1):
          balance += (ch == "A") - (ch == "B")
          if balance in first:
              best = max(best, i - first[balance])
          else:
              first[balance] = i
      print(best)
    hints:
      - "Перебор всех подстрок для длинной строки слишком медленный."
      - "Посчитай для каждого префикса разность между количеством A и B. Что значит, если у двух префиксов она одинаковая?"
      - "Для каждой разности достаточно помнить самую раннюю позицию."
    tests:
      - files:
          i24_3.txt: "AABCB\n"
        output: 5
      - files:
          i24_3.txt: "CCC\n"
        output: 3

