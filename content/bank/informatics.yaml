  # ── №19–21. Теория игр ───────────────────────────────────────────────────
  - exam_item: 19
    source_ref: "EGE-TUTOR-2027, стартовый банк: информатика №19, задача 1"
    difficulty: 2
    time_norm_minutes: 4
