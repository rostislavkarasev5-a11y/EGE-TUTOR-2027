      Сколько Кбайт занимает один снимок?
    answer: 3750
    solution: |-
      65 536 = 2¹⁶, значит на пиксель нужно 16 бит = 2 байта.
      1600 · 1200 · 2 = 3 840 000 байт; 3 840 000 / 1024 = 3750 Кбайт.
    hints:
      - "Сколько бит нужно, чтобы закодировать 65 536 разных цветов?"
      - "Объём = число пикселей × бит на пиксель. Помни: 1 Кбайт = 1024 байта."

  - exam_item: 7
    source_ref: "EGE-TUTOR-2027, стартовый банк: информатика №7, задача 2"
    difficulty: 3
    time_norm_minutes: 4
    skills: [I07.media_volume]
    statement: |-
      Музыкальный фрагмент записали в формате стерео (2 канала) с частотой дискретизации
      48 кГц и разрешением 24 бита. Запись длилась 2 минуты 40 секунд, сжатие не
      использовалось, служебных данных нет.
      Определите размер файла в Мбайтах. В ответе запишите ближайшее целое число,
      не меньшее размера файла.
    answer: 44
    solution: |-
      Объём = 2 · 48 000 · 24 · 160 бит = 368 640 000 бит = 46 080 000 байт.
      46 080 000 / 1 048 576 ≈ 43,95 Мбайт, округляем вверх: 44.
    hints:
      - "Объём звука = каналы × частота × разрешение × время в секундах."
      - "Переведи биты в байты, а байты в Мбайты (1 Мбайт = 1024 · 1024 байт)."
      - "Ответ нужно округлить вверх до целого."

  - exam_item: 7
    source_ref: "EGE-TUTOR-2027, стартовый банк: информатика №7, задача 3"
