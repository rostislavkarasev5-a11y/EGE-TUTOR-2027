    skills: [I22.processes]
    assets: [informatics/files/i22_3.csv]
    statement: |-
      В файле i22_3.csv содержится информация о вычислительных процессах (вместо электронной
      таблицы — CSV с разделителем «;»). Столбцы: ID процесса; время выполнения в мс; ID
      процессов, от которых он зависит (через запятую, 0 — зависимостей нет). Процесс
      начинается сразу после завершения всех процессов, от которых он зависит; количество
      одновременно выполняемых процессов не ограничено.
      На какое наибольшее количество миллисекунд можно увеличить время выполнения процесса
      с ID 16, чтобы минимальное время завершения всех процессов не изменилось?
    answer: 62
    solution: |-
      Это «резерв времени» процесса 16. Проще всего пересчитать общее время для увеличенной
      длительности процесса 16 и найти наибольшее увеличение, при котором оно не меняется:

      def total_time(extra):
          finish = {}
          for pid, time, deps in rows:
              start = max((finish[d] for d in deps), default=0)
              finish[pid] = start + time + (extra if pid == "16" else 0)
          return max(finish.values())

      base = total_time(0)
      extra = 0
      while total_time(extra + 1) == base:
          extra += 1
      print(extra)

      Другой способ: резерв = (самое позднее допустимое окончание процесса 16) − (самое раннее),
      где позднее окончание считается от конца по зависимым процессам.
    hints:
      - "Найди общее время выполнения всех процессов."
      - "Какие процессы зависят от процесса 16 (напрямую и через другие процессы)?"
      - "Увеличивай длительность процесса 16 и смотри, когда общее время начнёт расти."
    tests:
      - files:
          i22_3.csv: |
            ID;Время;Зависимости
            1;1;0
            2;1;0
            3;1;0
