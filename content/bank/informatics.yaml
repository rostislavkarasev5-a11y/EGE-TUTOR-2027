      игрок, сделавший последний ход. В начальный момент в первой куче 5 камней, во второй —
      S камней, 1 ≤ S ≤ 58.
      Найдите минимальное значение S, при котором одновременно: у Вани есть выигрышная
      стратегия, позволяющая ему выиграть первым или вторым ходом при любой игре Пети;
      у Вани нет стратегии, которая позволит ему гарантированно выиграть первым ходом.
