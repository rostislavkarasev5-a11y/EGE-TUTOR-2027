  # ── №22. Параллельные процессы (вместо электронной таблицы — CSV) ─────────
  - exam_item: 22
    source_ref: "EGE-TUTOR-2027, стартовый банк: информатика №22, задача 1"
    difficulty: 2
    time_norm_minutes: 7
    skills: [I22.processes]
    assets: [informatics/files/i22_1.csv]
    statement: |-
      В файле i22_1.csv содержится информация о вычислительных процессах (на экзамене — в
      электронной таблице; здесь — CSV с разделителем «;»). Столбцы: ID процесса; время его
      выполнения в миллисекундах; ID процессов, от которых он зависит (через запятую,
      0 — зависимостей нет). Процесс может начаться только после завершения всех процессов,
      от которых он зависит. Независимые процессы выполняются параллельно, количество
      одновременно выполняемых процессов не ограничено; каждый процесс начинается как можно
      раньше.
      Определите минимальное время (в мс), через которое завершится выполнение всех процессов.
    answer: 41
    solution: |-
      Время окончания процесса = (наибольшее время окончания его зависимостей, или 0) +
      его длительность. Зависимости в файле всегда указывают на процессы, записанные выше,
      поэтому строки можно обрабатывать сверху вниз. Ответ — наибольшее время окончания.

      finish = {}
      lines = open("i22_1.csv", encoding="utf-8").read().split("\n")[1:]
      for line in lines:
          if line:
              pid, time, deps = line.split(";")
              start = max((finish[d] for d in deps.split(",") if d != "0"), default=0)
              finish[pid] = start + int(time)
      print(max(finish.values()))
    hints:
      - "Когда может начаться процесс, у которого есть зависимости?"
      - "Посчитай время окончания каждого процесса по порядку и возьми наибольшее."
    tests:
      - files:
          i22_1.csv: |
            ID;Время;Зависимости
            1;3;0
            2;4;1
            3;2;0
            4;5;2,3
        output: 12

