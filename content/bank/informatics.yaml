    answer: "463 4788"
    solution: |-
      a = [int(line) for line in open("i17_3.txt", encoding="utf-8")]
      total, n = sum(a), len(a)
      count, best = 0, None
      for i in range(n - 3):
          x, y = a[i], a[i + 3]
          above = (x * n > total) + (y * n > total)   # x > среднего ⇔ x·n > сумма
          if above == 1 and (x + y) % 9 == 0:
              count += 1
              best = x + y if best is None else max(best, x + y)
      print(count, best)

      Сравнение x·n > сумма избавляет от дробного среднего и ошибок округления.
