      - "Объём сжатого изображения — 75 % от исходного: запиши неравенство для числа бит на пиксель i."
      - "Число цветов при i битах на пиксель равно 2 в степени i."

  # ── №8. Комбинаторика ─────────────────────────────────────────────────────
  - exam_item: 8
    source_ref: "EGE-TUTOR-2027, стартовый банк: информатика №8, задача 1"
    difficulty: 2
    time_norm_minutes: 6
    skills: [I08.counting, I00.itertools]
    statement: |-
      Ира составляет пятибуквенные слова из букв Л, У, Н, А. Каждая буква может встречаться
      в слове любое количество раз (или не встречаться вовсе), но буква У должна
      встречаться ровно два раза. Словом считается любая последовательность букв, не
      обязательно осмысленная. Сколько слов может составить Ира?
    answer: 270
    solution: |-
      Места для двух букв У выбираются C(5, 2) = 10 способами, на остальные три места ставится
      любая из трёх букв Л, Н, А: 3³ = 27. Итого 10 · 27 = 270.
      Программа: sum(1 for w in itertools.product("ЛУНА", repeat=5) if w.count("У") == 2).
    hints:
      - "Сначала выбери, на каких двух местах стоят буквы У."
      - "На каждое из оставшихся мест можно поставить любую из трёх других букв."

  - exam_item: 8
    source_ref: "EGE-TUTOR-2027, стартовый банк: информатика №8, задача 2"
    difficulty: 3
    time_norm_minutes: 6
    skills: [I08.counting, I00.itertools]
    statement: |-
      Из букв слова ПАРУС составляют шестибуквенные слова. Буквы могут повторяться,
      использовать все буквы не обязательно. Слово не должно начинаться с гласной, и в
      нём никакие две гласные (А, У) не должны стоять рядом.
      Сколько таких слов можно составить?
    answer: 5319
    solution: |-
      Перебор всех 5⁶ = 15 625 слов программой:

      from itertools import product
      count = 0
      for w in product("ПАРУС", repeat=6):
          if w[0] in "АУ":
              continue
          if any(a in "АУ" and b in "АУ" for a, b in zip(w, w[1:])):
              continue
          count += 1
      print(count)

      Можно и динамикой: пусть g(k), s(k) — число подходящих слов длины k, оканчивающихся на
      гласную и на согласную; s(1) = 3, g(1) = 0, s(k) = 3(s(k−1) + g(k−1)), g(k) = 2·s(k−1).
    hints:
      - "Гласных в слове ПАРУС две, согласных три."
      - "Удобно считать отдельно слова, которые заканчиваются на гласную и на согласную."
      - "Или переберите все слова через itertools.product и отбросьте неподходящие."

  - exam_item: 8
    source_ref: "EGE-TUTOR-2027, стартовый банк: информатика №8, задача 3"
    difficulty: 4
    time_norm_minutes: 6
    skills: [I08.counting, I00.itertools]
    statement: |-
      Сколько существует шестизначных чисел, записанных в семеричной системе счисления,
      в которых цифра 5 встречается ровно один раз и никакие две нечётные цифры не стоят
      рядом? Запись числа не может начинаться с нуля.
    answer: 16448
    solution: |-
      Цифры семеричной системы: 0–6, нечётные — 1, 3, 5. Перебор всех наборов из шести цифр:

      from itertools import product
      count = 0
      for d in product(range(7), repeat=6):
          if d[0] == 0 or d.count(5) != 1:
              continue
          if any(a % 2 and b % 2 for a, b in zip(d, d[1:])):
              continue
          count += 1
      print(count)
    hints:
      - "Какие цифры есть в семеричной системе и какие из них нечётные?"
      - "Не забудь про запрет на ноль в старшем разряде."
      - "Перебор 7⁶ вариантов через itertools.product работает мгновенно."

  # ── №9. Обработка числовой информации (вместо электронной таблицы — CSV) ──
  - exam_item: 9
    source_ref: "EGE-TUTOR-2027, стартовый банк: информатика №9, задача 1"
    difficulty: 2
    time_norm_minutes: 7
    skills: [I09.spreadsheet_rows]
    assets: [informatics/files/i09_1.csv]
    statement: |-
      В файле i09_1.csv в каждой строке записаны четыре натуральных числа, разделённые
      знаком «;» (на экзамене такие данные дают в электронной таблице; файл можно открыть
      в ней или обработать программой).
      Определите количество строк, в которых одновременно выполнены условия:
      — все четыре числа различны;
      — наибольшее из чисел строки строго меньше суммы трёх остальных.
    answer: 1189
    solution: |-
      Для каждой строки проверяем len(set(row)) == 4 и max(row) < sum(row) − max(row).
      В электронной таблице: столбец с формулой
      =ЕСЛИ(И(СЧЁТЕСЛИ(A1:D1;A1)=1;…;МАКС(A1:D1)<СУММ(A1:D1)-МАКС(A1:D1));1;0) и сумма столбца.

      count = 0
      for line in open("i09_1.csv", encoding="utf-8"):
          row = list(map(int, line.split(";")))
          if len(set(row)) == 4 and max(row) < sum(row) - max(row):
              count += 1
      print(count)
    hints:
      - "Как проверить, что все числа в строке различны? Подумай о множестве (set) или СЧЁТЕСЛИ."
      - "«Сумма трёх остальных» — это сумма всей строки минус наибольшее число."
    tests:
      - files:
          i09_1.csv: |
            1;2;3;4
            5;5;6;7
            10;3;3;3
            2;3;4;9
            20;30;40;50
        output: 2

  - exam_item: 9
    source_ref: "EGE-TUTOR-2027, стартовый банк: информатика №9, задача 2"
    difficulty: 3
    time_norm_minutes: 7
    skills: [I09.spreadsheet_rows]
    assets: [informatics/files/i09_2.csv]
    statement: |-
      В файле i09_2.csv в каждой строке записаны шесть натуральных чисел, разделённых
      знаком «;» (вместо электронной таблицы — текстовый файл).
      Определите количество строк, в которых одновременно выполнены условия:
      — в строке ровно три чётных числа;
      — сумма чётных чисел строки больше суммы нечётных;
      — наибольшее число строки нечётное.
    answer: 76
    solution: |-
      Для каждой строки разделяем числа на чётные и нечётные и проверяем три условия:

      count = 0
      for line in open("i09_2.csv", encoding="utf-8"):
          row = list(map(int, line.split(";")))
          even = [x for x in row if x % 2 == 0]
          odd = [x for x in row if x % 2 == 1]
          if len(even) == 3 and sum(even) > sum(odd) and max(row) % 2 == 1:
              count += 1
      print(count)
    hints:
      - "Раздели числа строки на два списка: чётные и нечётные."
      - "Третье условие проверяется по максимуму всей строки, а не только нечётных чисел."
