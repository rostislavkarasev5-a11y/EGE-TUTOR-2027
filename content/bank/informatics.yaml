  # ── №12. Исполнитель Редактор ─────────────────────────────────────────────
  - exam_item: 12
    source_ref: "EGE-TUTOR-2027, стартовый банк: информатика №12, задача 1"
    difficulty: 2
    time_norm_minutes: 6
    skills: [I12.string_rewriting, I00.strings]
    statement: |-
      Исполнитель Редактор работает со строками цифр. Команда заменить(v, w) заменяет
      в строке первое слева вхождение цепочки v на цепочку w; команда нашлось(v) проверяет,
      есть ли цепочка v в строке.
      Какая строка получится, если применить программу к строке из 70 единиц?

      ПОКА нашлось(111) ИЛИ нашлось(22)
        ЕСЛИ нашлось(111)
          ТО заменить(111, 2)
          ИНАЧЕ заменить(22, 1)
        КОНЕЦ ЕСЛИ
      КОНЕЦ ПОКА
    answer: 121
    solution: |-
      Программа на Python повторяет работу Редактора:

      s = "1" * 70
      while "111" in s or "22" in s:
          if "111" in s:
              s = s.replace("111", "2", 1)
          else:
              s = s.replace("22", "1", 1)
      print(s)

      Рассуждение: пока есть три единицы подряд, они превращаются в двойку, и двойки
      накапливаются слева. Затем пары двоек превращаются в единицы, и всё повторяется, пока
      не останется строка без «111» и «22».
    hints:
