  - exam_item: 9
    source_ref: "EGE-TUTOR-2027, стартовый банк: математика №9, задача 3"
    statement: >-
      Лампочка стоит на расстоянии d₁ от собирающей линзы с фокусным расстоянием f = 30 см,
      а её чёткое изображение получается на экране на расстоянии d₂ по другую сторону линзы.
      Величины связаны формулой 1/d₁ + 1/d₂ = 1/f. Лампочку можно отодвигать от линзы
      (d₁ > f). При каком наименьшем расстоянии d₁ (в сантиметрах) изображение окажется
      на расстоянии не больше 150 см от линзы?
    answer: "37,5"
    solution: >-
      1/d₂ = 1/30 − 1/d₁. Условие d₂ ≤ 150 означает 1/d₂ ≥ 1/150, то есть
      1/30 − 1/d₁ ≥ 1/150, 1/d₁ ≤ 4/150, d₁ ≥ 150/4 = 37,5 см.
    hints:
      - "Вырази 1/d₂ через d₁ из формулы."
      - "Условие d₂ ≤ 150 равносильно 1/d₂ ≥ 1/150. Подставь и реши неравенство относительно d₁."
