  # ── №15. Неравенства ─────────────────────────────────────────────────────
  - exam_item: 15
    source_ref: "EGE-TUTOR-2027, стартовый банк: математика №15, задача 1"
    statement: >-
      Решите неравенство (x² − x − 12)/(x − 6)² ≤ 0.
      В ответ запишите количество целых решений неравенства.
    answer: 8
    solution: >-
      Знаменатель (x − 6)² > 0 при x ≠ 6, поэтому неравенство равносильно системе
      x² − x − 12 ≤ 0, x ≠ 6. (x − 4)(x + 3) ≤ 0 ⇔ −3 ≤ x ≤ 4; точка 6 сюда не входит.
      Решение: [−3; 4]. Целые решения: −3, −2, −1, 0, 1, 2, 3, 4 — их восемь.
    hints:
      - "Знаменатель — квадрат. Какой у него знак и где он равен нулю?"
      - "Разложи числитель на множители и примени метод интервалов."
    difficulty: 2
    time_norm_minutes: 15
    skills: [M15.intervals]

  - exam_item: 15
    source_ref: "EGE-TUTOR-2027, стартовый банк: математика №15, задача 2"
    statement: >-
      Решите неравенство 4ˣ − 9·2ˣ + 8 ≤ 0.
      В ответ запишите сумму всех целых решений неравенства.
    answer: 6
    solution: >-
      Замена t = 2ˣ > 0: t² − 9t + 8 ≤ 0, (t − 1)(t − 8) ≤ 0, 1 ≤ t ≤ 8.
      1 ≤ 2ˣ ≤ 8 ⇔ 0 ≤ x ≤ 3. Решение: [0; 3]. Целые решения 0, 1, 2, 3, их сумма 6.
    hints:
      - "Сделай замену t = 2ˣ, учитывая, что t > 0."
      - "Получится квадратное неравенство относительно t. Затем вернись к x."
    difficulty: 3
    time_norm_minutes: 20
    skills: [M15.exp_log_inequalities]

  - exam_item: 15
    source_ref: "EGE-TUTOR-2027, стартовый банк: математика №15, задача 3"
    statement: >-
      Решите неравенство log₃(x² − 4x) ≤ log₃(x + 6).
      В ответ запишите сумму всех целых решений неравенства.
    answer: 10
    solution: >-
      ОДЗ: x² − 4x > 0 и x + 6 > 0, то есть x ∈ (−6; 0) ∪ (4; +∞).
      Основание 3 > 1, поэтому x² − 4x ≤ x + 6, x² − 5x − 6 ≤ 0, −1 ≤ x ≤ 6.
      С учётом ОДЗ: x ∈ [−1; 0) ∪ (4; 6]. Целые решения −1, 5, 6, их сумма 10.
    hints:
