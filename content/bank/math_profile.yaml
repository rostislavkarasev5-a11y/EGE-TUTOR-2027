# Стартовый банк задач: профильная математика (ADR-0016).
#
# Все задачи написал Claude (ИИ) специально для этого репозитория. Это НЕ задания ФИПИ,
# не задачи открытого банка и не задачи из сборников: сюжеты и числа придуманы заново,
# поэтому каждая задача помечена source: AI_GENERATED («Сгенерировано ИИ, не задание ФИПИ»).
#
# Как проверено: ответ каждой задачи ещё раз вычисляется независимо от этого файла
# (SymPy, точные дроби или перебор) в tests/content/test_bank_math.py и сравнивается
# с ключом. Только поэтому задачи имеют статус REVIEWED. Если тест расходится с ключом,
# задача считается DISPUTED и исправляется.
#
# По 3 задачи на номер: задача 1 — сложность 2, задача 2 — сложность 3, задача 3 — сложность 4.
# Задания 13–19 в диагностике проверяются только по итоговому числовому ответу
# (несколько чисел — через «; » по возрастанию); полное решение приведено в solution.
#
#   ege bank   (обычный ege import такие задачи от ИИ со статусом REVIEWED не принимает)

defaults:
  subject: math
  source: AI_GENERATED
  source_version: "стартовый банк v1"
  verification_status: REVIEWED

tasks:
  # ── №1. Планиметрия ──────────────────────────────────────────────────────
  - exam_item: 1
    source_ref: "EGE-TUTOR-2027, стартовый банк: математика №1, задача 1"
    statement: "В треугольнике ABC угол C равен 90°, AC = 9, BC = 40. Найдите AB."
    answer: 41
    solution: "AB — гипотенуза. По теореме Пифагора AB² = 9² + 40² = 81 + 1600 = 1681 = 41², AB = 41."
    hints:
      - "Против прямого угла лежит гипотенуза. Какая это сторона?"
      - "По теореме Пифагора AB² = AC² + BC². Посчитай сумму квадратов и извлеки корень."
    difficulty: 2
    time_norm_minutes: 2
    skills: [M01.triangles]

  - exam_item: 1
    source_ref: "EGE-TUTOR-2027, стартовый банк: математика №1, задача 2"
    statement: >-
      Основания равнобедренной трапеции равны 7 и 19, а боковая сторона равна 10.
      Найдите площадь трапеции.
    answer: 104
    solution: >-
      Опустим высоты из концов меньшего основания. Они отсекают от большего основания
      два равных отрезка длиной (19 − 7) : 2 = 6. В прямоугольном треугольнике с гипотенузой 10
      и катетом 6 второй катет (высота) равен √(100 − 36) = 8.
      Площадь S = (7 + 19) : 2 · 8 = 13 · 8 = 104.
    hints:
      - "Площадь трапеции — полусумма оснований, умноженная на высоту. Не хватает высоты."
      - "Высоты из вершин меньшего основания отсекают от большего основания два равных отрезка. Найди их длину."
      - "Высота — катет прямоугольного треугольника с гипотенузой 10. Примени теорему Пифагора."
    difficulty: 3
    time_norm_minutes: 3
    skills: [M01.quadrilaterals, M01.area]

  - exam_item: 1
    source_ref: "EGE-TUTOR-2027, стартовый банк: математика №1, задача 3"
    statement: "Стороны треугольника равны 13, 14 и 15. Найдите радиус окружности, вписанной в этот треугольник."
    answer: 4
    solution: >-
      Полупериметр p = (13 + 14 + 15) : 2 = 21. По формуле Герона
      S = √(21 · 8 · 7 · 6) = √7056 = 84. Радиус вписанной окружности r = S : p = 84 : 21 = 4.
    hints:
      - "Радиус вписанной окружности связан с площадью: S = p · r, где p — полупериметр."
      - "Площадь треугольника по трём сторонам находится по формуле Герона: S = √(p(p − a)(p − b)(p − c))."
    difficulty: 4
    time_norm_minutes: 4
    skills: [M01.triangles, M01.area]

  # ── №2. Векторы ──────────────────────────────────────────────────────────
  - exam_item: 2
    source_ref: "EGE-TUTOR-2027, стартовый банк: математика №2, задача 1"
    statement: "Даны векторы a(7; −2) и b(−4; 6). Найдите длину вектора a + b."
    answer: 5
    solution: "a + b = (7 − 4; −2 + 6) = (3; 4). Длина равна √(3² + 4²) = √25 = 5."
    hints:
      - "Координаты суммы векторов — суммы соответствующих координат."
      - "Длина вектора (x; y) равна √(x² + y²)."
    difficulty: 2
    time_norm_minutes: 2
    skills: [M02.coordinates]

  - exam_item: 2
    source_ref: "EGE-TUTOR-2027, стартовый банк: математика №2, задача 2"
    statement: >-
      Даны векторы a(4; −1) и b(2; 3). Найдите скалярное произведение векторов a + 2b и a − b.
    answer: -4
    solution: >-
      a + 2b = (4 + 4; −1 + 6) = (8; 5), a − b = (4 − 2; −1 − 3) = (2; −4).
      Скалярное произведение: 8 · 2 + 5 · (−4) = 16 − 20 = −4.
    hints:
      - "Сначала найди координаты векторов a + 2b и a − b."
      - "Скалярное произведение векторов (x₁; y₁) и (x₂; y₂) равно x₁x₂ + y₁y₂."
    difficulty: 3
    time_norm_minutes: 3
    skills: [M02.coordinates, M02.dot_product]

  - exam_item: 2
    source_ref: "EGE-TUTOR-2027, стартовый банк: математика №2, задача 3"
    statement: >-
      Длины векторов a и b равны 5 и 3, а угол между ними равен 120°. Найдите длину вектора a − b.
    answer: 7
    solution: >-
      a · b = |a| · |b| · cos 120° = 5 · 3 · (−1/2) = −7,5.
      |a − b|² = |a|² − 2a · b + |b|² = 25 + 15 + 9 = 49, значит |a − b| = 7.
    hints:
      - "Квадрат длины вектора равен его скалярному квадрату: |a − b|² = (a − b) · (a − b)."
      - "Раскрой скобки: |a|² − 2a · b + |b|². Скалярное произведение a · b найди через косинус угла."
    difficulty: 4
    time_norm_minutes: 4
    skills: [M02.dot_product]

  # ── №3. Стереометрия ─────────────────────────────────────────────────────
  - exam_item: 3
    source_ref: "EGE-TUTOR-2027, стартовый банк: математика №3, задача 1"
    statement: "Рёбра прямоугольного параллелепипеда, выходящие из одной вершины, равны 2, 6 и 9. Найдите диагональ параллелепипеда."
    answer: 11
    solution: "Квадрат диагонали равен сумме квадратов трёх измерений: d² = 4 + 36 + 81 = 121, d = 11."
    hints:
      - "Квадрат диагонали прямоугольного параллелепипеда равен сумме квадратов трёх его измерений."
      - "Посчитай 2² + 6² + 9² и извлеки корень."
    difficulty: 2
    time_norm_minutes: 3
    skills: [M03.polyhedra]

  - exam_item: 3
    source_ref: "EGE-TUTOR-2027, стартовый банк: математика №3, задача 2"
    statement: >-
      Объём конуса равен 24. Цилиндр имеет такое же основание, как этот конус,
      а его высота в 2 раза больше высоты конуса. Найдите объём цилиндра.
    answer: 144
    solution: >-
      V конуса = (1/3)·S·h = 24, значит S·h = 72. Объём цилиндра S · 2h = 2 · 72 = 144.
    hints:
      - "Объём конуса — треть произведения площади основания на высоту, объём цилиндра — произведение."
      - "Сначала найди произведение S·h для конуса, а потом учти, что высота цилиндра вдвое больше."
    difficulty: 3
    time_norm_minutes: 4
    skills: [M03.solids_of_revolution]

  - exam_item: 3
    source_ref: "EGE-TUTOR-2027, стартовый банк: математика №3, задача 3"
    statement: >-
      В правильной четырёхугольной пирамиде сторона основания равна 10, а апофема
      (высота боковой грани) равна 13. Найдите объём пирамиды.
    answer: 400
    solution: >-
      Высота пирамиды, апофема и отрезок от центра основания до середины стороны
      (он равен половине стороны, 5) образуют прямоугольный треугольник с гипотенузой 13.
      Высота h = √(169 − 25) = 12. V = (1/3) · 10² · 12 = 400.
    hints:
      - "Для объёма нужна высота пирамиды. Найди прямоугольный треугольник, где апофема — гипотенуза."
      - "Расстояние от центра квадрата до середины его стороны равно половине стороны."
      - "V = (1/3) · S основания · h."
    difficulty: 4
    time_norm_minutes: 5
    skills: [M03.polyhedra]

  # ── №4. Начала теории вероятностей ───────────────────────────────────────
  - exam_item: 4
    source_ref: "EGE-TUTOR-2027, стартовый банк: математика №4, задача 1"
    statement: >-
      В коробке 25 одинаковых на вид конфет, из них 8 — с орехом. Аня наугад берёт одну конфету.
      Найдите вероятность того, что конфета окажется с орехом.
    answer: "0,32"
    solution: "Благоприятных исходов 8, всего 25. P = 8/25 = 0,32."
    hints:
      - "Вероятность — число благоприятных исходов, делённое на число всех исходов."
      - "Подели количество конфет с орехом на общее количество конфет."
    difficulty: 2
    time_norm_minutes: 2
    skills: [M04.classical]

  - exam_item: 4
    source_ref: "EGE-TUTOR-2027, стартовый банк: математика №4, задача 2"
    statement: >-
      Монету бросают три раза. Найдите вероятность того, что орёл выпадет ровно два раза.
    answer: "0,375"
    solution: >-
      Всего исходов 2³ = 8. Ровно два орла: ООР, ОРО, РОО — 3 исхода. P = 3/8 = 0,375.
    hints:
      - "Выпиши все возможные исходы трёх бросков: их 2 · 2 · 2."
      - "Сколько исходов содержит ровно два орла? Решка может оказаться на любом из трёх мест."
    difficulty: 3
    time_norm_minutes: 3
    skills: [M04.classical]

  - exam_item: 4
    source_ref: "EGE-TUTOR-2027, стартовый банк: математика №4, задача 3"
    statement: >-
      В кружке робототехники 10 юношей и 6 девушек. Для поездки на соревнования случайным
      образом выбирают двух человек. Найдите вероятность того, что будут выбраны юноша и девушка.
    answer: "0,5"
    solution: >-
      Всего способов выбрать двоих из 16: 16 · 15 : 2 = 120. Пар «юноша + девушка»:
      10 · 6 = 60. P = 60/120 = 0,5.
    hints:
      - "Число способов выбрать двух человек из n равно n(n − 1)/2."
      - "Пару «юноша и девушка» можно составить 10 · 6 способами."
    difficulty: 4
    time_norm_minutes: 4
    skills: [M04.classical]

  # ── №5. Вероятности сложных событий ──────────────────────────────────────
  - exam_item: 5
    source_ref: "EGE-TUTOR-2027, стартовый банк: математика №5, задача 1"
    statement: >-
      Биатлонист попадает в мишень с вероятностью 0,8 при каждом выстреле независимо
      от других выстрелов. Он стреляет два раза. Найдите вероятность того, что первым
      выстрелом он попадёт, а вторым промахнётся.
    answer: "0,16"
    solution: "Вероятность промаха 1 − 0,8 = 0,2. События независимы: 0,8 · 0,2 = 0,16."
    hints:
      - "Сначала найди вероятность промаха при одном выстреле."
      - "Для независимых событий вероятность того, что произойдут оба, равна произведению вероятностей."
    difficulty: 2
    time_norm_minutes: 4
    skills: [M05.sum_product]

  - exam_item: 5
    source_ref: "EGE-TUTOR-2027, стартовый банк: математика №5, задача 2"
    statement: >-
      В зале стоят два кофейных автомата. Первый исправен с вероятностью 0,9, второй —
      с вероятностью 0,85, причём автоматы ломаются независимо друг от друга. Найдите
      вероятность того, что хотя бы один автомат исправен.
    answer: "0,985"
    solution: >-
      Оба неисправны с вероятностью 0,1 · 0,15 = 0,015. Хотя бы один исправен:
      1 − 0,015 = 0,985.
    hints:
      - "Удобнее найти вероятность противоположного события: оба автомата неисправны."
      - "Вероятности неисправности: 0,1 и 0,15. Перемножь их и вычти из единицы."
    difficulty: 3
    time_norm_minutes: 5
    skills: [M05.sum_product]

  - exam_item: 5
    source_ref: "EGE-TUTOR-2027, стартовый банк: математика №5, задача 3"
    statement: >-
      Детали выпускают две линии: на первой делают 60% всех деталей, на второй — 40%.
      На первой линии брак составляет 2%, на второй — 5%. Случайно выбранная деталь
      оказалась бракованной. Найдите вероятность того, что она сделана на второй линии.
    answer: "0,625"
    solution: >-
      P(брак) = 0,6 · 0,02 + 0,4 · 0,05 = 0,012 + 0,02 = 0,032.
      P(вторая линия | брак) = 0,02 : 0,032 = 0,625.
    hints:
      - "Сначала найди полную вероятность того, что случайная деталь бракованная."
      - "Нужная вероятность — доля «брака со второй линии» во всём браке: 0,4 · 0,05 делить на P(брак)."
    difficulty: 4
    time_norm_minutes: 6
    skills: [M05.conditional]

  # ── №6. Простейшие уравнения ─────────────────────────────────────────────
  - exam_item: 6
    source_ref: "EGE-TUTOR-2027, стартовый банк: математика №6, задача 1"
    statement: "Найдите корень уравнения 7ˣ⁻² = 49."
    answer: 4
    solution: "49 = 7², значит x − 2 = 2, x = 4."
    hints:
      - "Представь 49 как степень числа 7."
      - "Если основания равны, равны и показатели: x − 2 = 2."
    difficulty: 2
    time_norm_minutes: 3
    skills: [M06.exponential]

  - exam_item: 6
    source_ref: "EGE-TUTOR-2027, стартовый банк: математика №6, задача 2"
    statement: "Решите уравнение √(2x + 19) = x + 2. Если корней несколько, в ответ запишите больший из них."
    answer: 3
    solution: >-
      Нужно x + 2 ≥ 0. Возведём в квадрат: 2x + 19 = x² + 4x + 4, x² + 2x − 15 = 0,
      x = −5 или x = 3. Условию x + 2 ≥ 0 удовлетворяет только x = 3.
    hints:
      - "Возведи обе части в квадрат, но помни: правая часть должна быть неотрицательной."
      - "Получится квадратное уравнение x² + 2x − 15 = 0. Проверь каждый корень условием x + 2 ≥ 0."
    difficulty: 3
    time_norm_minutes: 4
    skills: [M06.irrational]

  - exam_item: 6
    source_ref: "EGE-TUTOR-2027, стартовый банк: математика №6, задача 3"
    statement: "Найдите корень уравнения log₂(x + 3) + log₂(x − 1) = 5."
    answer: 5
    solution: >-
      ОДЗ: x > 1. log₂((x + 3)(x − 1)) = 5, (x + 3)(x − 1) = 32, x² + 2x − 35 = 0,
      x = −7 или x = 5. В ОДЗ входит только x = 5.
    hints:
      - "Сумма логарифмов с одинаковым основанием — логарифм произведения."
      - "Получится (x + 3)(x − 1) = 2⁵. Не забудь проверить ОДЗ: x > 1."
    difficulty: 4
    time_norm_minutes: 5
    skills: [M06.logarithmic]

  # ── №7. Вычисления и преобразования ─────────────────────────────────────
  - exam_item: 7
    source_ref: "EGE-TUTOR-2027, стартовый банк: математика №7, задача 1"
    statement: "Найдите значение выражения 12⁷ : (4⁶ · 3⁷)."
    answer: 4
    solution: "12⁷ = 4⁷ · 3⁷, поэтому 12⁷ : (4⁶ · 3⁷) = 4⁷ : 4⁶ = 4."
    hints:
      - "Разложи основание 12 в произведение двух множителей, которые есть в знаменателе."
      - "Степень произведения равна произведению степеней. Что сократится с 3⁷?"
    difficulty: 2
    time_norm_minutes: 3
    skills: [M07.powers_roots]

  - exam_item: 7
    source_ref: "EGE-TUTOR-2027, стартовый банк: математика №7, задача 2"
    statement: "Найдите значение выражения log₅75 − log₅3 + 9^(log₃4)."
    answer: 18
    solution: >-
      log₅75 − log₅3 = log₅25 = 2. 9^(log₃4) = (3^(log₃4))² = 4² = 16. Итого 2 + 16 = 18.
    hints:
      - "Разность логарифмов с одним основанием — логарифм частного."
      - "Запиши 9 как 3² и воспользуйся основным логарифмическим тождеством a^(logₐb) = b."
    difficulty: 3
    time_norm_minutes: 4
    skills: [M07.logarithms]

  - exam_item: 7
    source_ref: "EGE-TUTOR-2027, стартовый банк: математика №7, задача 3"
    statement: "Найдите tg α, если cos α = −5/13 и π < α < 3π/2."
    answer: "2,4"
    solution: >-
      sin²α = 1 − 25/169 = 144/169. В третьей четверти синус отрицателен: sin α = −12/13.
      tg α = sin α : cos α = (−12/13) : (−5/13) = 12/5 = 2,4.
    hints:
      - "Найди sin α из основного тригонометрического тождества."
      - "В какой четверти лежит α? Какой там знак у синуса и у тангенса?"
    difficulty: 4
    time_norm_minutes: 5
    skills: [M07.trig]

  # ── №8. Производная и первообразная ─────────────────────────────────────
  - exam_item: 8
    source_ref: "EGE-TUTOR-2027, стартовый банк: математика №8, задача 1"
    statement: >-
      Материальная точка движется прямолинейно по закону x(t) = t³ − 4t² + 5t, где x — расстояние
      от точки отсчёта в метрах, t — время в секундах. Найдите скорость точки (в м/с) в момент t = 3 с.
    answer: 8
    solution: "v(t) = x′(t) = 3t² − 8t + 5, v(3) = 27 − 24 + 5 = 8 м/с."
    hints:
      - "Скорость — производная координаты по времени."
      - "Найди x′(t) = 3t² − 8t + 5 и подставь t."
    difficulty: 2
    time_norm_minutes: 4
    skills: [M08.derivative_meaning]

  - exam_item: 8
    source_ref: "EGE-TUTOR-2027, стартовый банк: математика №8, задача 2"
    statement: >-
      Касательная к графику функции y = x² − 5x + 7 параллельна прямой y = 3x + 1.
      Найдите ординату точки касания.
    answer: 3
    solution: >-
      У параллельных прямых равные угловые коэффициенты: y′ = 2x − 5 = 3, x = 4.
      Ордината: 16 − 20 + 7 = 3.
    hints:
