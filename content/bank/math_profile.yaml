      - "Сумма двух времён равна 7. Получится квадратное уравнение; оставь подходящий по смыслу корень."
    difficulty: 3
    time_norm_minutes: 6
    skills: [M10.motion]

  - exam_item: 10
    source_ref: "EGE-TUTOR-2027, стартовый банк: математика №10, задача 3"
    statement: >-
      Два насоса, работая вместе, наполняют бассейн за 6 часов. Первый насос в одиночку
      наполняет его на 5 часов быстрее, чем второй в одиночку. За сколько часов наполнит
      бассейн один второй насос?
    answer: 15
    solution: >-
      Пусть второй наполняет за x ч, первый — за x − 5 ч. 1/x + 1/(x − 5) = 1/6,
