  # ── №14. Стереометрическая задача ───────────────────────────────────────
  - exam_item: 14
    source_ref: "EGE-TUTOR-2027, стартовый банк: математика №14, задача 1"
    statement: >-
      В прямоугольном параллелепипеде ABCDA₁B₁C₁D₁ (ABCD — нижнее основание, AA₁ ∥ BB₁ ∥ CC₁ ∥ DD₁)
      известно: AB = 6, AD = 8, AA₁ = 5.
      а) Докажите, что плоскость ACC₁ перпендикулярна плоскости ABC.
      б) Найдите расстояние от точки B до плоскости ACC₁.
      В ответ запишите число из пункта б).
    answer: "4,8"
    solution: >-
      а) Ребро CC₁ перпендикулярно плоскости основания ABC и лежит в плоскости ACC₁, значит,
      по признаку плоскости перпендикулярны.
      б) Опустим перпендикуляр BH на прямую AC в плоскости основания. BH ⊥ AC и BH ⊥ CC₁
      (CC₁ перпендикулярно всей плоскости основания), значит BH ⊥ плоскости ACC₁, и искомое
      расстояние равно BH. В прямоугольном треугольнике ABC (∠B = 90°) AC = √(36 + 64) = 10,
      BH = AB · BC : AC = 6 · 8 : 10 = 4,8.
      Ответ: б) 4,8.
    hints:
      - "Для пункта а) найди в плоскости ACC₁ прямую, перпендикулярную основанию."
      - "Перпендикуляр из B к прямой AC в основании будет перпендикулярен всей плоскости ACC₁. Почему?"
      - "Высота прямоугольного треугольника к гипотенузе равна произведению катетов, делённому на гипотенузу."
    difficulty: 2
    time_norm_minutes: 19
    skills: [M14.proof, M14.angles_distances]

  - exam_item: 14
    source_ref: "EGE-TUTOR-2027, стартовый банк: математика №14, задача 2"
    statement: >-
      В правильной треугольной призме ABCA₁B₁C₁ (ABC — нижнее основание, AA₁ ∥ BB₁ ∥ CC₁)
      все рёбра равны 6.
      а) Докажите, что AB₁ = BC₁.
      б) Найдите косинус угла между прямыми AB₁ и BC₁.
      В ответ запишите число из пункта б).
    answer: "0,25"
    solution: >-
      а) AB₁ и BC₁ — диагонали равных квадратов ABB₁A₁ и BCC₁B₁ со стороной 6, поэтому
      AB₁ = BC₁ = 6√2.
      б) Введём координаты: A(0; 0; 0), B(6; 0; 0), C(3; 3√3; 0), ось z вдоль бокового ребра.
      Тогда B₁(6; 0; 6), C₁(3; 3√3; 6). AB₁ = (6; 0; 6), BC₁ = (−3; 3√3; 6).
      AB₁ · BC₁ = −18 + 0 + 36 = 18, |AB₁| = |BC₁| = √72.
      cos φ = |18| : 72 = 0,25.
      Ответ: б) 0,25.
    hints:
      - "Боковые грани правильной призмы с равными рёбрами — квадраты."
      - "Удобно ввести координаты: A в начале, AB по оси x, боковое ребро по оси z."
      - "Косинус угла между прямыми — модуль скалярного произведения направляющих векторов, делённый на произведение их длин."
    difficulty: 3
    time_norm_minutes: 25
    skills: [M14.proof, M14.angles_distances]

  - exam_item: 14
    source_ref: "EGE-TUTOR-2027, стартовый банк: математика №14, задача 3"
    statement: >-
      В правильной четырёхугольной пирамиде SABCD с вершиной S и основанием ABCD сторона
      основания равна 16, а высота SO равна 6 (O — центр основания).
      а) Докажите, что расстояние от точки A до плоскости SBC в два раза больше расстояния
      от точки O до этой плоскости.
      б) Найдите расстояние от точки A до плоскости SBC.
      В ответ запишите число из пункта б).
    answer: "9,6"
    solution: >-
      а) AD ∥ BC, поэтому AD ∥ плоскости SBC, и все точки AD одинаково удалены от неё.
      Пусть M и K — середины AD и BC. Точка O — середина MK, а K лежит в плоскости SBC,
      поэтому расстояние от M (то есть от A) вдвое больше расстояния от O.
      б) BC ⊥ OK и BC ⊥ SO, значит BC ⊥ плоскости SOK, и перпендикуляр OH из O на SK
      перпендикулярен плоскости SBC. OK = 8, SO = 6, SK = √(36 + 64) = 10,
      OH = SO · OK : SK = 6 · 8 : 10 = 4,8. Расстояние от A равно 2 · 4,8 = 9,6.
      Ответ: б) 9,6.
    hints:
      - "Прямая AD параллельна плоскости SBC. Что это значит для расстояний от точек AD?"
