  - exam_item: 10
    source_ref: "EGE-TUTOR-2027, стартовый банк: математика №10, задача 2"
    statement: >-
      Моторная лодка прошла 48 км по течению реки и вернулась обратно, затратив на весь путь
      7 часов. Скорость течения 2 км/ч. Найдите собственную скорость лодки (в км/ч).
    answer: 14
    solution: >-
      Пусть v — собственная скорость. 48/(v + 2) + 48/(v − 2) = 7, 96v = 7(v² − 4),
      7v² − 96v − 28 = 0, v = (96 ± 100)/14. Положительный корень v = 14.
    hints:
