  - exam_item: 9
    source_ref: "EGE-TUTOR-2027, стартовый банк: математика №9, задача 2"
    statement: >-
      Мяч подбросили вверх, и его высота (в метрах) меняется по закону h(t) = 1,4 + 14t − 5t²,
      где t — время в секундах. Сколько секунд мяч находился на высоте не менее 9,4 м?
    answer: "1,2"
    solution: >-
