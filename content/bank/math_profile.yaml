      - "Логарифм по основанию 3 возрастает, поэтому неравенство для аргументов сохраняет знак."
      - "Пересеки решение квадратного неравенства с ОДЗ и аккуратно выпиши целые точки."
    difficulty: 4
    time_norm_minutes: 25
    skills: [M15.exp_log_inequalities, M15.intervals]

  # ── №16. Экономическая задача ───────────────────────────────────────────
  - exam_item: 16
    source_ref: "EGE-TUTOR-2027, стартовый банк: математика №16, задача 1"
    statement: >-
      Марина берёт в банке кредит 1 200 000 рублей на 10 месяцев. Каждый месяц сначала
      банк увеличивает долг на 2%, затем Марина делает платёж. Платежи подобраны так, что
      после каждого платежа долг уменьшается на одну и ту же сумму по сравнению с долгом
      после предыдущего платежа (до первого платежа долг равен 1 200 000 рублей), а после
      десятого платежа долг равен нулю. Сколько рублей Марина заплатит банку за весь срок?
    answer: 1332000
    solution: >-
      После каждого платежа долг уменьшается на 1 200 000 : 10 = 120 000 рублей, то есть
      после k-го платежа он равен 120 000 · (10 − k). Платёж k-го месяца — проценты на долг
      начала месяца плюс 120 000. Сумма процентов: 0,02 · 120 000 · (10 + 9 + … + 1) =
      2400 · 55 = 132 000. Всего: 1 200 000 + 132 000 = 1 332 000 рублей.
    hints:
      - "Долг убывает равномерно: на сколько он уменьшается каждый месяц?"
      - "Каждый платёж — это проценты на текущий долг плюс одинаковая часть основного долга."
      - "Проценты начисляются на долги 1 200 000, 1 080 000, …, 120 000. Сложи их как арифметическую прогрессию."
    difficulty: 2
    time_norm_minutes: 19
    skills: [M16.loans]

  - exam_item: 16
    source_ref: "EGE-TUTOR-2027, стартовый банк: математика №16, задача 2"
    statement: >-
      Вкладчик открыл вклад на 1 000 000 рублей на 4 года. В конце каждого года банк
      увеличивает сумму на вкладе на 10%. Сразу после начисления процентов в конце первого
      и в конце второго года вкладчик пополняет вклад на одну и ту же сумму X тысяч рублей
      (X — целое число), других операций нет. Найдите наименьшее X, при котором через
      4 года на вкладе будет не меньше 2 000 000 рублей.
    answer: 211
    solution: >-
      Будем считать в тысячах рублей. Через 4 года на вкладе будет
      1000 · 1,1⁴ + X · 1,1³ + X · 1,1² = 1464,1 + 2,541X (первое пополнение растёт три года,
      второе — два). Условие 1464,1 + 2,541X ≥ 2000 даёт X ≥ 535,9 : 2,541 ≈ 210,9.
      Проверка: при X = 210 получится 1997,71 < 2000, при X = 211 — 2000,251 ≥ 2000.
      Наименьшее целое X = 211.
    hints:
      - "Проследи, сколько раз будут начислены проценты на каждое пополнение."
      - "Итог через 4 года — линейная функция от X. Составь неравенство «не меньше 2000»."
      - "Не забудь, что X целое: проверь соседние значения."
    difficulty: 3
    time_norm_minutes: 25
    skills: [M16.optimization]

  - exam_item: 16
    source_ref: "EGE-TUTOR-2027, стартовый банк: математика №16, задача 3"
    statement: >-
      Кредит взят на 3 года. В конце каждого года банк увеличивает долг на 10%, после чего
      заёмщик вносит платёж. Первые два платежа одинаковые, третий в 2 раза больше каждого
      из них, и после третьего платежа долг полностью погашен. Третий платёж составил
      2 662 000 рублей. Найдите сумму кредита (в рублях).
    answer: 4310000
    solution: >-
      Пусть S — сумма кредита, x — первый платёж, третий равен 2x = 2 662 000, x = 1 331 000.
      Долг после третьего платежа: ((1,1S − x)·1,1 − x)·1,1 − 2x = 0, то есть
      1,331S = x(1,21 + 1,1 + 2) = 4,31x. S = 4,31 · 1 331 000 : 1,331 = 4 310 000 рублей.
    hints:
      - "Обозначь первый платёж x и сразу найди его по третьему платежу."
      - "Распиши долг после каждого года: умножить на 1,1 и вычесть платёж. В конце должно получиться 0."
    difficulty: 4
    time_norm_minutes: 31
    skills: [M16.loans]

  # ── №17. Планиметрическая задача ────────────────────────────────────────
  - exam_item: 17
    source_ref: "EGE-TUTOR-2027, стартовый банк: математика №17, задача 1"
    statement: >-
      В прямоугольном треугольнике ABC с прямым углом C проведена высота CH, AC = 15, BC = 20.
      а) Докажите, что треугольники ACH и CBH подобны.
      б) Найдите длину высоты CH.
      В ответ запишите число из пункта б).
    answer: 12
    solution: >-
      а) Оба треугольника прямоугольные (∠AHC = ∠CHB = 90°), и ∠ACH = 90° − ∠A = ∠B.
      Значит, треугольники ACH и CBH подобны по двум углам.
      б) AB = √(225 + 400) = 25. Площадь: AC · BC = AB · CH, CH = 15 · 20 : 25 = 12.
      Ответ: б) 12.
    hints:
      - "Сравни острые углы: чему равен угол ACH, если угол A известен?"
      - "Площадь треугольника можно записать двумя способами: через катеты и через гипотенузу с высотой."
    difficulty: 2
    time_norm_minutes: 19
    skills: [M17.proof, M17.computation]

  - exam_item: 17
    source_ref: "EGE-TUTOR-2027, стартовый банк: математика №17, задача 2"
    statement: >-
      Основания трапеции ABCD равны AD = 12 и BC = 4, диагонали пересекаются в точке O.
      Площадь трапеции равна 64.
      а) Докажите, что площади треугольников AOB и COD равны.
      б) Найдите площадь треугольника AOD.
      В ответ запишите число из пункта б).
    answer: 36
    solution: >-
      а) Треугольники ABD и ACD имеют общее основание AD и равные высоты, значит равны по
      площади; вычитая общую часть AOD, получаем S(AOB) = S(COD).
      б) Треугольники BOC и DOA подобны с коэффициентом BC : AD = 1 : 3, поэтому
      BO : OD = 1 : 3. Пусть S(BOC) = s. Тогда S(AOD) = 9s, а S(AOB) = S(COD) = 3s
      (общая высота из A, основания BO и OD относятся как 1 : 3). Всего 16s = 64, s = 4,
      S(AOD) = 36.
      Ответ: б) 36.
    hints:
      - "Сравни треугольники ABD и ACD: какое у них основание и какая высота?"
      - "Треугольники BOC и DOA подобны. Найди коэффициент подобия и отношение площадей."
      - "Вырази площади всех четырёх треугольников через площадь BOC и сложи."
    difficulty: 3
    time_norm_minutes: 25
    skills: [M17.proof, M17.computation]

  - exam_item: 17
    source_ref: "EGE-TUTOR-2027, стартовый банк: математика №17, задача 3"
    statement: >-
      В треугольнике ABC стороны AB = 13, BC = 14, AC = 15. Вписанная окружность касается
      стороны BC в точке K, а AH — высота треугольника.
      а) Докажите, что BK = (AB + BC − AC)/2.
      б) Найдите расстояние между точками K и H.
      В ответ запишите число из пункта б).
    answer: 1
    solution: >-
      а) Отрезки касательных из одной вершины равны: BK = BM, CK = CL, AM = AL (M, L — точки
      касания на AB и AC). Тогда AB + BC − AC = (AM + BK) + (BK + CK) − (AL + CK) = 2BK.
      б) BK = (13 + 14 − 15) : 2 = 6. Пусть BH = y, тогда AH² = 13² − y² = 15² − (14 − y)²,
      169 − y² = 225 − 196 + 28y − y², 28y = 140, y = 5. Точки H и K лежат на BC
      по одну сторону от B, KH = 6 − 5 = 1.
      Ответ: б) 1.
    hints:
      - "Отрезки касательных, проведённых из одной точки к окружности, равны."
      - "Найди BH из двух прямоугольных треугольников с общим катетом AH."
      - "Обе точки лежат на стороне BC: сравни расстояния BK и BH."
    difficulty: 4
    time_norm_minutes: 31
    skills: [M17.proof, M17.computation]

  # ── №18. Задача с параметром ────────────────────────────────────────────
  - exam_item: 18
    source_ref: "EGE-TUTOR-2027, стартовый банк: математика №18, задача 1"
    statement: >-
      Найдите все значения параметра a, при каждом из которых уравнение x² − 2ax + a + 6 = 0
      имеет ровно один корень. В ответ запишите найденные значения через «; » в порядке возрастания.
    answer: "-2; 3"
    solution: >-
      Квадратное уравнение имеет ровно один корень, когда дискриминант равен нулю:
      D/4 = a² − (a + 6) = a² − a − 6 = (a − 3)(a + 2) = 0, a = −2 или a = 3.
      Ответ: −2; 3.
    hints:
      - "Старший коэффициент равен 1, значит уравнение всегда квадратное."
      - "Ровно один корень у квадратного уравнения — когда дискриминант равен нулю."
    difficulty: 2
    time_norm_minutes: 26
    skills: [M18.analytical]

  - exam_item: 18
    source_ref: "EGE-TUTOR-2027, стартовый банк: математика №18, задача 2"
    statement: >-
      Найдите все целые значения параметра a, при каждом из которых уравнение |x² − 4x| = a
      имеет ровно четыре различных корня. В ответ запишите эти значения через «; »
      в порядке возрастания.
    answer: "1; 2; 3"
    solution: >-
      Построим график y = |x² − 4x|: парабола y = x² − 4x с вершиной (2; −4), часть ниже оси
      абсцисс отражена вверх. Получается «W»-образный график с нулями в x = 0 и x = 4
      и локальным максимумом 4 в точке x = 2. Горизонтальная прямая y = a пересекает
      график в четырёх точках при 0 < a < 4 (при a = 0 — две точки, при a = 4 — три,
      при a > 4 — две, при a < 0 — ни одной). Целые значения: 1, 2, 3.
    hints:
      - "Построй график y = |x² − 4x|: отрази вверх часть параболы под осью абсцисс."
      - "Число корней — число точек пересечения графика с горизонтальной прямой y = a."
      - "Найди высоту «горба» между нулями функции — это граница нужного промежутка."
    difficulty: 3
    time_norm_minutes: 35
    skills: [M18.graphical]

  - exam_item: 18
    source_ref: "EGE-TUTOR-2027, стартовый банк: математика №18, задача 3"
    statement: >-
      Найдите все целые значения параметра a, при каждом из которых уравнение
      (x − a)(x − 2a)·√((5 − x)(x + 3)) = 0 имеет ровно четыре различных корня.
      В ответ запишите эти значения через «; » в порядке возрастания.
    answer: "-1; 1; 2"
    solution: >-
      Область определения: (5 − x)(x + 3) ≥ 0, то есть x ∈ [−3; 5]. Корень уравнения — точка
      этого отрезка, где один из множителей равен нулю: x = −3, x = 5 (корень обращается
      в ноль) и x = a, x = 2a, если они лежат в [−3; 5].
      Четыре различных корня — когда a и 2a лежат в [−3; 5], различны между собой
      (a ≠ 0) и не совпадают с −3 и 5. Из −3 ≤ a ≤ 5 и −3 ≤ 2a ≤ 5 получаем
      −1,5 ≤ a ≤ 2,5; исключая a = −1,5 (2a = −3), a = 2,5 (2a = 5) и a = 0, имеем
      a ∈ (−1,5; 0) ∪ (0; 2,5). Целые значения: −1, 1, 2.
    hints:
      - "Сначала найди область определения: подкоренное выражение неотрицательно."
      - "Произведение равно нулю, если хотя бы один множитель равен нулю, а остальные имеют смысл."
      - "Следи, чтобы корни a и 2a лежали в области определения и не совпадали с другими корнями."
    difficulty: 4
    time_norm_minutes: 44
    skills: [M18.analytical]

  # ── №19. Числа и их свойства ────────────────────────────────────────────
  - exam_item: 19
    source_ref: "EGE-TUTOR-2027, стартовый банк: математика №19, задача 1"
    statement: >-
      Найдите наименьшее натуральное число, которое при делении на 5 даёт остаток 3,
      при делении на 7 — остаток 4, а при делении на 9 — остаток 2.
    answer: 263
    solution: >-
      Числа с остатком 2 при делении на 9: 2, 11, 20, 29, 38, … Из них остаток 4 при делении
      на 7 впервые даёт 11; дальше подходят 11 + 63k. Перебираем 11, 74, 137, 200, 263, …
      и ищем остаток 3 при делении на 5: 11 → 1, 74 → 4, 137 → 2, 200 → 0, 263 → 3.
      Так как 5, 7 и 9 попарно взаимно просты, все решения имеют вид 263 + 315k, и
      наименьшее натуральное — 263.
    hints:
      - "Начни с самого большого делителя: выпиши числа с остатком 2 при делении на 9."
      - "Найдя число, подходящее для 9 и 7, прибавляй к нему 63 и проверяй остаток при делении на 5."
    difficulty: 2
    time_norm_minutes: 21
    skills: [M19.divisibility]

  - exam_item: 19
    source_ref: "EGE-TUTOR-2027, стартовый банк: математика №19, задача 2"
    statement: >-
      Несколько различных натуральных чисел в сумме дают 100.
      а) Может ли среди них быть ровно 10 чисел, если все числа нечётные?
      б) Может ли среди них быть ровно 11 чисел, если все числа нечётные?
      в) Какое наибольшее количество чисел может быть (без условия нечётности)?
      В ответ запишите число из пункта в).
    answer: 13
    solution: >-
      а) Да: 1 + 3 + 5 + … + 19 = 100 (десять первых нечётных чисел).
      б) Нет: сумма 11 нечётных чисел нечётна, а 100 — чётное.
      в) Сумма k различных натуральных чисел не меньше 1 + 2 + … + k = k(k + 1)/2.
      При k = 14 это 105 > 100, поэтому чисел не больше 13. Пример для 13:
      1 + 2 + … + 12 + 22 = 78 + 22 = 100. Значит, наибольшее количество — 13.
      Ответ: а) да; б) нет; в) 13.
    hints:
      - "Чему равна сумма первых n нечётных чисел?"
      - "Подумай о чётности суммы нечётного количества нечётных чисел."
      - "Оценка: сумма k различных натуральных чисел не меньше 1 + 2 + … + k. Для примера увеличь последнее число."
    difficulty: 3
    time_norm_minutes: 28
    skills: [M19.estimate_example]

  - exam_item: 19
    source_ref: "EGE-TUTOR-2027, стартовый банк: математика №19, задача 3"
    statement: >-
      Из чисел 1, 2, 3, …, 20 выбирают несколько различных так, чтобы сумма никаких двух
      выбранных чисел не делилась на 7.
      а) Можно ли выбрать 9 чисел?
      б) Можно ли выбрать 11 чисел?
      в) Какое наибольшее количество чисел можно выбрать?
      В ответ запишите число из пункта в).
    answer: 10
    solution: >-
      Разобьём числа по остаткам при делении на 7: остаток 0 — {7, 14}; остатки 1–6 — по
      три числа (например, остаток 1 — {1, 8, 15}, остаток 6 — {6, 13, 20}).
      Сумма двух чисел делится на 7, если их остатки в сумме дают 0 или 7, то есть оба
      числа кратны 7 или остатки образуют пару (1, 6), (2, 5), (3, 4).
      Оценка: из чисел, кратных 7, можно взять не больше одного; из каждой пары остатков
      можно брать числа только одного остатка — не больше трёх. Итого не больше
      1 + 3 + 3 + 3 = 10.
