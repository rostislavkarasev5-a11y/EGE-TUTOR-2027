      б) На отрезке [−2π; π] лежат: −11π/6, −7π/6, −π/2, π/6, 5π/6 (проверка по единичной
      окружности или двойным неравенством для k). Корней пять.
      Ответ: а) π/6 + 2πk, 5π/6 + 2πk, −π/2 + 2πk, k ∈ ℤ; б) −11π/6, −7π/6, −π/2, π/6, 5π/6.
    hints:
      - "Сделай замену t = sin x — получится квадратное уравнение."
      - "Не забудь, что |sin x| ≤ 1. Затем запиши серии корней для каждого значения t."
      - "Для отбора пройди по единичной окружности от −2π до π или реши двойные неравенства для k."
