name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows — основная платформа пользователя, Linux — облачная разработка.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python and dependencies
        run: uv sync --locked

      - name: Secrets check
        run: uv run python scripts/check_secrets.py

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Tests
        run: uv run pytest

      - name: CLI smoke
        run: uv run ege --version

      - name: CLI import smoke
        env:
          EGE_TUTOR_DATA_DIR: ${{ runner.temp }}/ege-data-smoke
        run: |
          uv run ege import content/sample/tasks.yaml --apply
          uv run ege tasks --source AI_GENERATED

      - name: install.bat (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        env:
          EGE_NONINTERACTIVE: "1"
          EGE_TUTOR_DATA_DIR: ${{ runner.temp }}\ege-data-install
        run: call install.bat

  server:
    # Сайт на сервере (ADR-0013): скрипты, Docker-образ и запуск контейнера.
    name: Server image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Shellcheck
        run: shellcheck -x deploy/*.sh

      - name: Compose file is valid
        run: |
          printf 'EGE_SITE_ADDRESS=example.invalid\n' > "$RUNNER_TEMP/compose.env"
          sudo mkdir -p /etc/ege-tutor && sudo touch /etc/ege-tutor/web.env
          docker compose --env-file "$RUNNER_TEMP/compose.env" -f deploy/docker-compose.yml config --quiet

      - name: Build image
        run: docker build -t ege-tutor:ci .

      - name: Sandbox selftest in isolated container
        # Те же ограничения, что у сервиса runner в deploy/docker-compose.yml (ADR-0014).
        run: |
          docker run --rm --network none --read-only --tmpfs /tmp:size=128m,mode=1777 \
            --cap-drop ALL --security-opt no-new-privileges --pids-limit 128 \
            --memory 512m --memory-swap 512m --cpus 1 --user 10002:10001 \
            ege-tutor:ci ege-runner selftest

      - name: Sandbox via socket (server) and docker run -i (Windows)
        run: |
          docker volume create ege-runner-ci
          docker run -d --name runner --network none --read-only \
            --tmpfs /tmp:size=128m,mode=1777 --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 128 --memory 512m --memory-swap 512m \
            --user 10002:10001 -v ege-runner-ci:/run/ege-runner \
            ege-tutor:ci ege-runner serve --socket /run/ege-runner/runner.sock
          for i in $(seq 1 20); do
            if docker exec runner ege-runner ping --socket /run/ege-runner/runner.sock; then break; fi
            sleep 1
          done
          docker run --rm -v ege-runner-ci:/run/ege-runner \
            -e EGE_RUNNER_SOCKET=/run/ege-runner/runner.sock ege-tutor:ci sh -ec '
              ege import content/sample/tasks.yaml --apply > /dev/null
              printf "%s\n" "a = [int(x) for x in open(\"numbers.txt\")]" \
                "print(sum((x < 0) != (y < 0) for x, y in zip(a, a[1:])))" > /tmp/solution.py
              id=$(python -c "from ege_tutor.core.app import TutorApp; print(next(t.id for t in TutorApp.create().tasks() if t.exam_item == 17))")
              ege run "$id" /tmp/solution.py | tee /tmp/out
              grep -q "Похоже, ответ: 3" /tmp/out'
          printf '%s' '{"code": "print(6 * 7)", "limits": {"time_limit_seconds": 5, "memory_limit_mb": 128}}' \
            | docker run --rm -i --network none --read-only --tmpfs /tmp:rw,size=64m \
                --cap-drop ALL --security-opt no-new-privileges --pids-limit 128 \
                ege-tutor:ci ege-runner once | tee /tmp/once.json
          grep -qF '"stdout": "42\n"' /tmp/once.json

      - name: Runner logs
        if: always()
        run: docker logs runner || true

      - name: Run site in container
        run: |
          docker run -d --name ege -p 8000:8000 ege-tutor:ci sh -c \
            'printf "ci-password-0123\nci-password-0123\n" | ege-web set-password && exec ege-web serve --host 0.0.0.0 --port 8000'
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/healthz; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/healthz
          curl -fsS http://127.0.0.1:8000/login | grep -q "Пароль"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/)" = "303"
          docker exec ege ege backup
          docker exec ege sh -c 'ls /data/backups/ege-*.db'

      - name: Container logs
        if: always()
        run: docker logs ege || true
